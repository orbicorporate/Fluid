function fmtDate(d){ try { const [y,m,dd]=d.split('-'); return `${dd}/${m}`; } catch(e){ return d; } }
function toMessage(s){
  const lines = [];
  if (s.title) lines.push(s.title + (s.artist?' · '+s.artist:''));
  if (s.link) lines.push(s.link);
  lines.push(s.capo ? 'Capotraste '+s.capo : 'Sem capotraste');
  if (s.bpm) lines.push(s.bpm+' bpm');
  lines.push('');
  (s.chords||[]).forEach(c => lines.push(codeOf(c) ? codeOf(c)+'  ('+detect(c)+')' : detect(c)));
  const st = fitStrum(s.strum, s.meter||'4/4'); if (st.some(Boolean)) { lines.push(''); lines.push('Batida: '+st.map(x=>GLYPH[x]).join(' ')); }
  return lines.join('\n');
}
function markWord(s, key){
  const s2 = JSON.parse(JSON.stringify(s)); const m = {...(s2.lmarks||{})};
  if (view.paint==='erase' || view.paint==null || m[key]===view.paint) delete m[key]; else m[key] = view.paint;
  s2.lmarks = m; saveSong(s2).then(()=>refreshSheet()); refreshSheet();
}
function bindSong(s){
  layer.querySelectorAll('[data-disp]').forEach(b => b.onclick = () => { setDisplay(b.dataset.disp); refreshSheet(); render(); });
  layer.onclick = e => {
    const lw = e.target.closest('[data-lw]'); if (lw){ markWord(s, lw.dataset.lw); return; }
    const pt = e.target.closest('[data-paint]'); if (pt){ view.paint = pt.dataset.paint==='erase' ? 'erase' : +pt.dataset.paint; refreshSheet(); return; }
    const rb = e.target.closest('[data-riff]'); if (rb){ playRiff(s, +rb.dataset.riff); return; }
    const hb = e.target.closest('[data-hear]'); if (hb){ playArpeggio(s.chords[+hb.dataset.hear], s.capo||0); return; }
    const k = e.target.closest('[data-know]'); if (k){ setMastered(k.dataset.know, !isMastered(k.dataset.know)); refreshSheet(); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act==='close') closeSheet();
    if (act==='edit') openEditor(s);
    if (act==='del') { view.confirmDel = true; refreshSheet(); }
    if (act==='del-no') { view.confirmDel = false; refreshSheet(); }
    if (act==='del-yes') { closeSheet(); deleteSong(s.id); toast('Música apagada'); }
    if (act==='practice') openPractice(s);
    if (act==='trocas') openTrocas(s);
    if (act==='ly-edit'){ const on = !(view.lyEdit && view.lyEditId===s.id); view.lyEdit = on; view.lyEditId = s.id; if (on && view.paint==null){ const u = uniqueChordIdx(s); view.paint = u.length ? u[0][1] : 'erase'; } refreshSheet(); return; }

    if (act==='copy') { const txt = toMessage(s); try { navigator.clipboard.writeText(txt).then(()=>toast('Copiado no formato do professor'), ()=>showCopy(txt)); } catch(err){ showCopy(txt); } }
  };
}
function showCopy(txt){
  const body = layer.querySelector('.sheet-body'); if (!body) return;

function renderLesson(){
  const L = led.l; const p = dateParts(L.date);
  const listUI = (k, ph) => `<div class="check-list">${L[k].map((it,i)=>`<div class="check-row${it.done?' done':''}">
      <button type="button" class="check" data-lcheck="${k}:${i}" aria-pressed="${!!it.done}" aria-label="${it.done?'Desmarcar':'Marcar como feito'}">${it.done?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>':''}</button>
      <input class="inp" data-li="${k}" value="${esc(it.t)}" placeholder="${ph}" aria-label="${ph}">
      <button type="button" class="x" data-ldel="${k}:${i}" aria-label="Remover item">${I.close}</button></div>`).join('')}
    <button type="button" class="btn ghost add-item" data-ladd="${k}">${I.plus}Adicionar</button></div>`;
  layer.innerHTML = `<div class="scrim" data-act="le-close"></div>
  <aside class="sheet" role="dialog" aria-modal="true" aria-label="${led.isNew?'Nova aula':'Aula'}">
    <div class="sheet-head">
      <button class="btn icon ghost" data-act="le-close" aria-label="Fechar sem salvar">${I.close}</button>
      <h2>${led.isNew?'Nova aula':'Aula de '+p.d+' '+p.mon}</h2>
      <button class="btn primary" data-act="le-save">Salvar aula</button>
    </div>
    <form class="sheet-body" id="leform" autocomplete="off">
      <div class="field" style="max-width:220px"><label for="le-date">Data</label><input class="inp" id="le-date" type="date" value="${esc(L.date)}"></div>
      <div class="field"><span class="lbl" id="le-songs-l">Músicas vistas na aula</span>
        ${songs.length ? `<div class="tagbar" role="group" aria-labelledby="le-songs-l" style="margin:0">${songs.map(s=>`<button type="button" class="tag${L.songs.includes(s.id)?' on':''}" style="--tc:${hueOf(s)}" data-lsong="${esc(s.id)}" aria-pressed="${L.songs.includes(s.id)}"><i class="dot" aria-hidden="true"></i>${esc(s.title||'Sem título')}</button>`).join('')}</div>` : `<p class="hint" style="margin:0">Cadastre músicas para ligar à aula.</p>`}</div>
      <div class="field"><label for="le-sum">O que foi passado</label><textarea class="inp" id="le-sum" rows="4" placeholder="Ex.: batida da Nomahe, trocar Em para G sem parar, capo na 2ª">${esc(L.summary)}</textarea></div>
      <div class="field"><span class="lbl">Lição de casa</span>${listUI('homework','Ex.: 5 min de troca Em e Am por dia')}</div>
      <div class="field"><span class="lbl">Dúvidas para a próxima aula</span>${listUI('questions','Ex.: como abafar na batida do reggae?')}</div>
      ${!led.isNew ? (led.confirm ? `<div class="confirm">Apagar esta aula? Não dá para desfazer.<span style="flex:1"></span><button type="button" class="btn ghost" data-act="le-del-no">Cancelar</button><button type="button" class="btn danger" data-act="le-del-yes">${I.trash}Apagar</button></div>` : `<button type="button" class="btn ghost danger" data-act="le-del" style="align-self:flex-start">${I.trash}Apagar aula</button>`) : ''}
    </form>
  </aside>`;
  document.getElementById('leform').onsubmit = e => e.preventDefault();
  layer.querySelectorAll('[data-li]').forEach(inp => inp.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); readLesson(); const k = inp.dataset.li; led.l[k].push({t:'',done:false}); renderLesson(); const all = layer.querySelectorAll(`[data-li="${k}"]`); all[all.length-1].focus(); } }));
  layer.onclick = e => {
    const t = e.target.closest('button,[data-act]'); if (!t) return; const d = t.dataset;
    if (d.act==='le-close'){ led=null; closeSheet(); return; }
    if (d.act==='le-save'){ readLesson(); const L2 = led.l; ['homework','questions'].forEach(k => L2[k] = L2[k].filter(x=>x.t.trim())); led=null; closeSheet(); saveLesson(L2).then(render); toast('Aula salva'); return; }
    if (d.act==='le-del'){ readLesson(); led.confirm=true; renderLesson(); return; }
    if (d.act==='le-del-no'){ readLesson(); led.confirm=false; renderLesson(); return; }
    if (d.act==='le-del-yes'){ const id = led.l.id; led=null; closeSheet(); deleteLesson(id).then(render); toast('Aula apagada'); return; }
    if (d.lsong){ readLesson(); const set = new Set(led.l.songs); set.has(d.lsong)?set.delete(d.lsong):set.add(d.lsong); led.l.songs=[...set]; renderLesson(); return; }
    if (d.ladd){ readLesson(); led.l[d.ladd].push({t:'',done:false}); renderLesson(); const all = layer.querySelectorAll(`[data-li="${d.ladd}"]`); all[all.length-1].focus(); return; }
    if (d.ldel){ readLesson(); const [k,i] = d.ldel.split(':'); led.l[k].splice(+i,1); renderLesson(); return; }
    if (d.lcheck){ readLesson(); const [k,i] = d.lcheck.split(':'); led.l[k][+i].done = !led.l[k][+i].done; renderLesson(); return; }
  };
}

const pendingCount = () => lessons.reduce((n,l)=>n+(l.homework||[]).filter(x=>!x.done).length,0);
function renderAulas(){
  const open = []; lessons.forEach(l => (l.homework||[]).forEach((h,i) => { if (!h.done) open.push({l,i,h}); }));
  const last = lessons[0]; const qs = last ? (last.questions||[]).map((q,i)=>({q,i})).filter(x=>!x.q.done) : [];
  const songById = id => songs.find(s=>s.id===id);
  app.innerHTML = headerHTML() + `
  ${lessons.length ? `<div class="aulas-top">
    <section class="panel"><div class="sec-h"><h3 class="ph"><span class="ph-ico hw" aria-hidden="true">${I.note}</span>Lição de casa pendente</h3><span class="chip ${open.length?'warn':'ok'}">${open.length?open.length+' '+(open.length===1?'item':'itens'):'tudo feito'}</span></div>
      ${open.length ? `<div class="check-list">${open.map(({l,i,h})=>`<div class="check-row"><button class="check" data-tcheck="${esc(l.id)}:homework:${i}" aria-label="Marcar como feito"></button><span class="check-t">${esc(h.t)}<small>aula de ${dateParts(l.date).d} ${dateParts(l.date).mon}</small></span></div>`).join('')}</div>` : `<p class="hint" style="margin:0">Nada pendente. Bom treino!</p>`}</section>
    <section class="panel ask"><div class="sec-h"><h3 class="ph"><span class="ph-ico" aria-hidden="true">?</span>Levar na próxima aula</h3>${qs.length?`<span class="chip">${qs.length} ${qs.length===1?'dúvida':'dúvidas'}</span>`:''}</div>
      ${qs.length ? `<div class="check-list">${qs.map(({q,i})=>`<div class="check-row"><button class="check" data-tcheck="${esc(last.id)}:questions:${i}" aria-label="Marcar como respondida" title="Marcar como respondida"></button><span class="check-t">${esc(q.t)}</span></div>`).join('')}</div>` : `<p class="hint ask-hint">Travou em alguma coisa no treino? Escreva aqui e pergunte ao professor na próxima aula.</p>`}
      <div class="ask-add"><input class="inp" id="q-new" placeholder="Ex.: como abafar a corda no ritmo?" maxlength="160" aria-label="Nova dúvida para a próxima aula" enterkeyhint="done"><button class="ask-btn" data-act="q-add" aria-label="Anotar dúvida">${I.plus}</button></div>
      ${qs.length?`<p class="ask-foot">Na aula, toque no quadradinho quando a dúvida for respondida.</p>`:''}</section>
  </div>` : ''}
  <div class="list">
    ${!lessons.length ? `<div class="empty"><h3>Nenhuma aula registrada</h3><p>Depois de cada aula, anote o que foi passado, a lição de casa e as dúvidas. Na próxima aula você abre aqui e já sabe o que perguntar.</p><button class="btn primary" data-act="new-lesson">${I.plus}Registrar a aula de hoje</button></div>`
      : lessons.map((l,idx)=>{ const p = dateParts(l.date); const hw = l.homework||[]; const done = hw.filter(x=>x.done).length;
        return `<button class="card lesson-card" data-lesson="${esc(l.id)}" style="animation-delay:${Math.min(idx,8)*40}ms">
          <span class="datebox"><b>${p.d}</b><small>${p.mon}</small></span>
          <span class="card-main"><h3>${idx===0?'Última aula':'Aula de '+p.wk}</h3>
            <span class="sub">${esc((l.summary||'Sem anotações').split('\n')[0])}</span>
            <span class="chips">${(l.songs||[]).map(songById).filter(Boolean).map(s=>`<span class="chip tagc" style="--tc:${hueOf(s)}">${esc(s.title||'Sem título')}</span>`).join('')}
              ${hw.length?`<span class="chip ${done===hw.length?'ok':''}">Lição ${done}/${hw.length}</span>`:''}
              ${(l.questions||[]).filter(q=>!q.done).length?`<span class="chip">${(l.questions||[]).filter(q=>!q.done).length} dúvida${(l.questions||[]).filter(q=>!q.done).length>1?'s':''}</span>`:''}</span>
          </span>${I.chev}</button>`; }).join('')}
  </div>`;
}
function trocasHTML(song){
  const num = view.display==='num';
  const lab = n => { const c = codeOf(shapeOf(n)); return num && c ? c : n; };
  const alt = n => { const c = codeOf(shapeOf(n)); return num ? n : (c || ''); };
  const steps = [];
  if (song){ const ns = songNames(song); for (let i=0;i<ns.length;i++){ const a = ns[i], b = ns[(i+1)%ns.length]; if (a===b) continue; if (i===ns.length-1 && ns.length===2) break; steps.push({a, b, k:pairKey(a,b), last:i===ns.length-1}); } }
  if (!steps.length) return `<p class="hint">Esta música precisa de pelo menos dois acordes diferentes para treinar as trocas.</p>`;
  let focus = -1, low = Infinity; steps.forEach((st,i) => { const b = bestOf(st.k); if (b < low){ low = b; focus = i; } });
  return `<div class="path" aria-label="Sequência de ${esc(song.title||'')}">${songNames(song).map((n,i,arr)=>`<span class="path-c${num?' mono':''}">${esc(lab(n))}</span>${i<arr.length-1?'<i aria-hidden="true">→</i>':'<i aria-hidden="true">↺</i>'}`).join('')}</div>
    <div class="steps">${steps.map((st,i)=>{ const r = changes.pairs[st.k];
      return `<button class="step${i===focus?' focus':''}" data-pair="${esc(st.a)}|${esc(st.b)}">
        <span class="step-i">${st.last?'volta':(i+1)+'ª'}</span>
        <span class="step-m"><span class="step-n${num?' mono':''}"><b>${esc(lab(st.a))}</b><i aria-hidden="true">→</i><b>${esc(lab(st.b))}</b></span>
          ${alt(st.a)&&alt(st.b)?`<small>${esc(alt(st.a))} → ${esc(alt(st.b))}</small>`:''}</span>
        <span class="step-r">${r ? `<b class="mono">${r.best}</b><small>recorde</small>` : (i===focus ? `<small class="go">comece aqui</small>` : `<small>sem marca</small>`)}</span>
        <span class="step-go" aria-hidden="true">${I.play}</span>
      </button>`; }).join('')}</div>`;
}

    <div class="sheet-head">

      ${trocasHTML(s)}
    </div>
  </aside>`;
}
function renderTreino(){
  const {names} = chordStats();
  const all = [...new Set([...names, ...QUICK])];
  const num = view.display==='num';
  const lab = n => { const c = codeOf(shapeOf(n)); return num && c ? c : n; };
  const alt = n => { const c = codeOf(shapeOf(n)); return num ? n : (c || ''); };
  const opt = n => { const c = codeOf(shapeOf(n)); return num && c ? c+'  ('+n+')' : n; };
  const withChords = songs.filter(s => new Set(songNames(s)).size >= 2);
  if (!withChords.some(s=>s.id===view.trSong)) view.trSong = withChords[0] && withChords[0].id;
  const song = withChords.find(s=>s.id===view.trSong);
  app.innerHTML = headerHTML() + `
  <section class="panel">
    <div class="sec-h"><h3>Troca de acordes em 1 minuto</h3><div class="seg" role="group" aria-label="Como mostrar os acordes"><button data-disp="num" aria-pressed="${num}">Números</button><button data-disp="name" aria-pressed="${!num}">Cifra</button></div></div>
    <ol class="how"><li>Escolha a música</li><li>Toque numa troca</li><li>Por 1 minuto, alterne os dois acordes e toque no círculo a cada troca limpa</li></ol>
    ${withChords.length ? `
    <div class="tagbar" role="group" aria-label="Música" style="margin:14px 0 18px">${withChords.map(s=>`<button class="tag${s.id===view.trSong?' on':''}" style="--tc:${hueOf(s)}" data-trsong="${esc(s.id)}" aria-pressed="${s.id===view.trSong}"><i class="dot" aria-hidden="true"></i>${esc(s.title||'Sem título')}</button>`).join('')}</div>
    ${trocasHTML(song)}`
    : `<p class="hint">Cadastre uma música com pelo menos dois acordes para treinar as trocas dela.</p>`}
    <details class="free"><summary>Treinar um par qualquer</summary>
      <div class="row" style="margin-top:10px">
        <select class="inp sel" id="pa" aria-label="Primeiro acorde">${all.map(n=>`<option value="${esc(n)}">${esc(opt(n))}</option>`).join('')}</select>
        <span aria-hidden="true">⇄</span>
        <select class="inp sel" id="pb" aria-label="Segundo acorde">${all.map((n,i)=>`<option value="${esc(n)}" ${i===1?'selected':''}>${esc(opt(n))}</option>`).join('')}</select>
        <button class="btn" data-act="pair-custom">Treinar</button>
      </div></details>
  </section>
  <section class="panel">
    <div class="sec-h"><h3>Afinação de referência</h3><span class="hint">toque na corda para ouvir, toque de novo para parar</span></div>
    <div class="tune">${TUNING.map(([s,n,pt])=>`<button class="tune-str" data-tune="${s}" aria-label="Corda ${s}, ${pt}"><b>${n}</b><small>${s}ª · ${pt}</small><span class="tline" style="--w:${(7-s)*.45+1}px" aria-hidden="true"></span></button>`).join('')}</div>
    <p class="hint" style="margin:12px 0 0">Afine sem capotraste. Com o capo, todas as cordas sobem juntas.</p>
  </section>`;
}

/* ---------- global wiring ---------- */
app.addEventListener('keydown', e => { if (e.target.id==='q-new' && e.key==='Enter'){ e.preventDefault(); addQuestion(); } });
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-open],[data-pop],[data-disp],[data-tag],[data-tagdel],[data-tab],[data-lesson],[data-tcheck],[data-pair],[data-tune],[data-trsong],[data-imp]'); if (!t) return;
  if (t.dataset.imp!=null){ importTrack(+t.dataset.imp); return; }
  if (t.dataset.tab){ setTab(t.dataset.tab); render(); return; }
  if (t.dataset.lesson){ openLesson(lessons.find(l=>l.id===t.dataset.lesson)); return; }
  if (t.dataset.tcheck){ const [id,list,i] = t.dataset.tcheck.split(':'); toggleItem(id, list, +i); toast(list==='homework'?'Lição marcada como feita':'Dúvida marcada como respondida'); return; }
  if (t.dataset.pair){ const [a,b] = t.dataset.pair.split('|'); openTrainer(a,b); return; }
  if (t.dataset.trsong){ view.trSong = t.dataset.trsong; render(); return; }
  if (t.dataset.tune){ tunePlay(+t.dataset.tune, t); return; }
  if (t.dataset.disp){ setDisplay(t.dataset.disp); render(); return; }
  if (t.dataset.open){ openSong(t.dataset.open); return; }
  if (t.dataset.pop){ showPop(t.dataset.pop); return; }
  if (t.dataset.tag){ view.tagFilter = view.tagFilter===t.dataset.tag ? null : t.dataset.tag; render(); return; }
  if (t.dataset.tagdel){ const n = t.dataset.tagdel; const c = songs.filter(s=>(s.tags||[]).includes(n)).length;
    if (t.dataset.armed){ removeTag(n); } else { t.dataset.armed='1'; t.classList.add('armed'); t.setAttribute('aria-label','Confirmar: apagar '+n); toast(c ? `Toque de novo para apagar "${n}" de ${c} ${c===1?'música':'músicas'}` : `Toque de novo para apagar "${n}"`); setTimeout(()=>{ delete t.dataset.armed; t.classList.remove('armed'); }, 3000); }
    return; }
  const a = t.dataset.act;
  if (a==='new-lesson'){ openLesson(null); return; }
  if (a==='pair-custom'){ const x = document.getElementById('pa').value, y = document.getElementById('pb').value; if (x===y){ toast('Escolha dois acordes diferentes'); return; } openTrainer(x,y); return; }
  if (a==='imp-go'){ const iq = document.getElementById('imp-q'); findMusic(iq && iq.value); return; }
  if (a==='imp-close'){ view.imp = null; view.impQ = ''; render(); return; }
  if (a==='tag-all'){ view.tagFilter=null; render(); return; }
  if (a==='clear-all'){ view.tagFilter=null; view.chordFilter=null; view.readyFilter=false; view.q=''; render(); return; }
  if (a==='ready'){ view.readyFilter = !view.readyFilter; render(); return; }
  if (a==='tags-edit'){ view.editTags = true; render(); const n=document.getElementById('tag-new'); n&&n.focus(); return; }
  if (a==='tags-done'){ const n=document.getElementById('tag-new'); const v = n && n.value; view.editTags = false; if (v) addTag(v).then(render); else render(); return; }
  if (a==='tag-add'){ const n=document.getElementById('tag-new'); addTag(n && n.value).then(tg=>{ render(); const m=document.getElementById('tag-new'); m&&m.focus(); }); return; }
  if (a==='new') openEditor(null);
  if (a==='theme') return toggleTheme();
  if (a==='q-add') return addQuestion();
  if (a==='paste') openEditor(null, {paste:true});
  if (a==='clear-filter'){ view.chordFilter=null; render(); }
  if (a==='focus-list'){ const l=document.getElementById('list'); l && l.scrollIntoView({behavior:'smooth',block:'start'}); }
});
document.addEventListener('keydown', e => {
  if (e.key===' ' && trainer && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){ e.preventDefault(); if (trainer.state==='run') trTap(); else startTrainer(); return; }
  if (e.key==='Escape' && trainer){ closeTrainer(); return; }
  if (e.key==='Escape' && view.sheet==='trocas'){ view.sheet='song'; refreshSheet(); return; }
  if (e.key==='Escape' && view.sheet==='lesson'){ led=null; closeSheet(); return; }
  if (e.key==='Escape'){ if (pop.chord) closePop(); else if (practice) closePractice(); else if (view.sheet==='editor'){ clearDraft(); ed=null; view.sheet = view.song?'song':null; view.sheet?refreshSheet():closeSheet(); } else if (view.sheet) closeSheet(); }
  if (e.key===' ' && practice && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName) && document.activeElement.tagName!=='BUTTON'){ e.preventDefault(); practice.playing?stopMetro():startMetro(); }
});

render();
initStore();
setTimeout(restoreDraft, 0);
})();
</script>

</body>
