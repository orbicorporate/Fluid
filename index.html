<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDEFF6">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fluid">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
</head>
<body>
<title>Fluid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Quicksand:wght@400;500;600&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one calm column (home = orbit + songs); song, editor and practice slide in as glass sheets over the ambient field */
:root{
  --bg:#EDEFF6; --text:#12131C; --muted:#50556A; --faint:#7A7F95;
  --surface:rgba(255,255,255,.62); --surface2:rgba(255,255,255,.5); --solid:#FFFFFF;
  --line:rgba(20,22,60,.09); --lineStrong:rgba(20,22,60,.16);
  --accent:#4F46E5; --accentInk:#4338CA; --onAccent:#FFFFFF;
  --glow:rgba(79,70,229,.26); --glowSoft:rgba(79,70,229,.09);
  --gi1:rgba(255,255,255,.92); --gi2:rgba(255,255,255,.42); --giBorder:rgba(255,255,255,.95);
  --blob1:#C7D2FE; --blob2:#FBCFE8; --blob3:#A5F3FC; --blobOp:.75;
  --ring:rgba(18,19,28,.10);
  --shadow:0 1px 0 rgba(255,255,255,.95) inset,0 16px 48px rgba(40,46,120,.09);
  --backdrop:rgba(228,232,246,.55);
  --ok:#15803D; --okBg:rgba(34,197,94,.13); --warn:#A14A06; --warnBg:rgba(245,158,11,.15); --bad:#B91C1C;
  --fDisplay:"Sora",ui-sans-serif,system-ui,sans-serif;
  --fBody:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --fMono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0706; --text:#F7F1ED; --muted:#BCA9A0; --faint:#8C7A71;
  --surface:rgba(34,20,14,.62); --surface2:rgba(44,26,18,.55); --solid:#1A100C;
  --line:rgba(255,214,190,.08); --lineStrong:rgba(255,214,190,.16);
  --accent:#FF7A1F; --accentInk:#FFA45E; --onAccent:#1C0A03;
  --glow:rgba(255,122,31,.42); --glowSoft:rgba(255,122,31,.14);
  --gi1:rgba(96,54,34,.5); --gi2:rgba(28,15,10,.5); --giBorder:rgba(255,214,190,.14);
  --blob1:#5A1F0B; --blob2:#0F4C63; --blob3:#E2570F; --blobOp:.34;
  --ring:rgba(255,214,190,.11);
  --shadow:0 1px 0 rgba(255,230,210,.06) inset,0 18px 50px rgba(0,0,0,.5);
  --backdrop:rgba(8,4,3,.6);
  --ice:#BDEBFF;
  --ok:#7DD3FC; --okBg:rgba(125,211,252,.13); --warn:#FDBA74; --warnBg:rgba(253,186,116,.14); --bad:#F87171;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0706; --text:#F7F1ED; --muted:#BCA9A0; --faint:#8C7A71;
  --surface:rgba(34,20,14,.62); --surface2:rgba(44,26,18,.55); --solid:#1A100C;
  --line:rgba(255,214,190,.08); --lineStrong:rgba(255,214,190,.16);
  --accent:#FF7A1F; --accentInk:#FFA45E; --onAccent:#1C0A03;
  --glow:rgba(255,122,31,.42); --glowSoft:rgba(255,122,31,.14);
  --gi1:rgba(96,54,34,.5); --gi2:rgba(28,15,10,.5); --giBorder:rgba(255,214,190,.14);
  --blob1:#5A1F0B; --blob2:#0F4C63; --blob3:#E2570F; --blobOp:.34;
  --ring:rgba(255,214,190,.11);
  --shadow:0 1px 0 rgba(255,230,210,.06) inset,0 18px 50px rgba(0,0,0,.5);
  --backdrop:rgba(8,4,3,.6);
  --ice:#BDEBFF;
  --ok:#7DD3FC; --okBg:rgba(125,211,252,.13); --warn:#FDBA74; --warnBg:rgba(253,186,116,.14); --bad:#F87171;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fBody);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--fDisplay);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--fMono);font-variant-numeric:tabular-nums}

/* ambient field */
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.ambient i{position:absolute;border-radius:50%;opacity:var(--blobOp);filter:blur(90px)}
.ambient i:nth-child(1){left:-140px;top:-60px;width:560px;height:460px;background:var(--blob1)}
.ambient i:nth-child(2){right:-160px;top:260px;width:520px;height:440px;background:var(--blob2);filter:blur(100px)}
.ambient i:nth-child(3){left:30%;bottom:-240px;width:620px;height:420px;background:var(--blob3);filter:blur(100px)}

.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 120px}

/* header */
.top{display:flex;align-items:center;gap:12px;padding-block:6px 4px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-orb{position:relative;width:40px;height:40px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text);background:linear-gradient(160deg,var(--gi1),var(--gi2));border:1px solid var(--giBorder);box-shadow:0 1px 0 var(--giBorder) inset,0 -10px 18px -12px var(--accent) inset,0 8px 20px -6px var(--glow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand-ico{width:32px;height:32px;overflow:visible}
.brand-ico .bd{transform-box:fill-box;transform-origin:center;animation:bdIn .6s cubic-bezier(.2,.8,.2,1) var(--d) both,bdPulse 3.2s ease-in-out calc(var(--d) + 1s) infinite}
.brand-ico .bs{transform-box:fill-box;transform-origin:center}
.brand:hover .brand-ico .bs{animation:bsVib .12s linear calc(var(--i) * .03s) 4 alternate}
@keyframes bdIn{from{transform:scale(0);opacity:0}70%{transform:scale(1.25);opacity:1}to{transform:scale(1)}}
@keyframes bdPulse{0%,100%{transform:scale(1)}50%{transform:scale(.82)}}
@keyframes bsVib{from{transform:translateX(-.5px)}to{transform:translateX(.5px)}}
.brand b{font-family:var(--fDisplay);font-weight:600;font-size:20px;letter-spacing:-.02em}
.brand span{display:block;font-size:12px;color:var(--muted);line-height:1.2}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-weight:500;font-size:14px;white-space:nowrap;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.btn:hover{transform:translateY(-1px);border-color:var(--lineStrong)}
.btn.primary{background:var(--accent);color:var(--onAccent);border-color:transparent;box-shadow:0 10px 26px var(--glow)}
.btn.ghost{background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.btn.icon{width:44px;padding:0}
.btn.danger{color:var(--bad)}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn[disabled]{opacity:.45;pointer-events:none}

/* orbit */
.orbit{position:relative;height:360px;margin-block:4px 6px;user-select:none}
.orbit svg.rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.orbit svg.rings ellipse{fill:none;stroke:var(--ring);stroke-width:1.2}
.orbit svg.rings ellipse.dash{stroke-dasharray:3 7}
.core{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--giBorder);background:linear-gradient(160deg,var(--gi1),var(--gi2));box-shadow:0 1px 0 var(--giBorder) inset,0 -18px 30px -18px var(--accent) inset,0 22px 50px var(--glow);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);padding:0}
.core::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px solid var(--accent);opacity:.55;border-right-color:transparent;border-bottom-color:transparent;border-left-color:transparent;animation:spin 7s linear infinite}
.core strong{font-family:var(--fDisplay);font-size:34px;font-weight:600;line-height:1;letter-spacing:-.03em}
.core small{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.25}
.core:hover{transform:scale(1.03)}
.core{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sat{position:absolute;left:0;top:0;will-change:transform;padding:0;border:0;background:none}
.sat .s-song{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--fDisplay);font-size:12px;font-weight:600;border:2px solid rgba(255,255,255,.9);box-shadow:0 6px 16px rgba(20,22,60,.18);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.sat .s-chord{min-width:38px;height:30px;padding:0 10px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--fDisplay);font-size:12.5px;font-weight:600;color:var(--accentInk);border:1px solid var(--giBorder);background:linear-gradient(160deg,var(--gi1),var(--gi2));box-shadow:0 6px 14px rgba(20,22,60,.10);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.sat:hover .s-song,.sat:hover .s-chord,.sat:focus-visible .s-song,.sat:focus-visible .s-chord{transform:scale(1.2)}
.sat.on .s-chord{background:var(--accent);color:var(--onAccent);border-color:transparent}
.sat .s-chord.mono{font-family:var(--fMono);font-size:11.5px;letter-spacing:.02em}
.orbit-legend{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--muted)}
.orbit-legend span{display:inline-flex;align-items:center;gap:6px}
.orbit-legend i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.orbit-legend i.c{background:transparent;border:1.5px solid var(--accent)}
.orbit-legend i.k{background:var(--ok)}
.orbit svg.rings ellipse.r3{stroke:var(--ok);stroke-opacity:.35}
.sat .s-chord.known{background:var(--ok);color:var(--bg);border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--ok) 35%,transparent)}
.sat.on .s-chord{box-shadow:0 0 0 3px var(--accent),0 8px 20px var(--glow)}
.sat .s-song.ready{box-shadow:0 0 0 3px var(--ok),0 6px 16px rgba(20,22,60,.18)}
.core.on{box-shadow:0 0 0 6px var(--glowSoft),0 22px 50px var(--glow)}
.core strong em{font-style:normal;font-size:.5em;color:var(--muted);font-weight:500}
.orbit-tip{margin:-4px auto 4px;text-align:center;font-size:13px;color:var(--muted);max-width:52ch}
.tagbar{display:flex;flex-wrap:wrap;gap:8px;margin-block:-4px 14px;align-items:center}
.tag{--tc:var(--accent);display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;border:1px solid color-mix(in srgb,var(--tc) 28%,transparent);background:color-mix(in srgb,var(--tc) 11%,var(--surface));color:color-mix(in srgb,var(--tc) 72%,var(--text));font-size:13px;font-weight:600;transition:transform .15s ease}
.tag:hover{transform:translateY(-1px)}
.tag small{font-size:11px;font-weight:500;opacity:.7;font-variant-numeric:tabular-nums}
.tag.on{background:var(--tc);color:#fff;border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--tc) 35%,transparent)}
.tag.on small{opacity:.85}
.tagbar{gap:10px;margin-block:6px 22px}
.tag{--tc:var(--accent);position:relative;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px 0 13px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--tc) 22%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 9%,var(--gi1)),color-mix(in srgb,var(--tc) 6%,var(--surface)));
  color:color-mix(in srgb,var(--tc) 75%,var(--text));font-size:13.5px;font-weight:600;
  box-shadow:0 1px 0 var(--giBorder) inset;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),background .2s ease,color .2s ease}
.tag i.dot{width:7px;height:7px;border-radius:50%;background:var(--tc);flex-shrink:0}
.tag small{font-size:11.5px;font-weight:500;opacity:.65;font-variant-numeric:tabular-nums}
.tag:hover{transform:translateY(-1px)}
.tag.on{color:#fff;border-color:transparent;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 88%,#fff),var(--tc));box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 14px -6px color-mix(in srgb,var(--tc) 60%,transparent)}
.tag.on i.dot{background:#fff}
.tag.on small{opacity:.85}
.tag.all{--tc:var(--muted)}
.tag.all.on{--tc:#3A3D55}
.tag.plain{--tc:var(--muted);background:transparent;border-style:dashed;border-color:var(--lineStrong);font-weight:500;color:var(--muted);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.tag.plain svg{width:14px;height:14px}
.tag.done{--tc:var(--accent);color:#fff;background:linear-gradient(170deg,color-mix(in srgb,var(--tc) 72%,#fff),var(--tc))}
.tag-edit{--tc:var(--accent);display:inline-flex;align-items:center;height:36px;padding:0 3px 0 4px;border-radius:999px;border:1px solid color-mix(in srgb,var(--tc) 35%,transparent);background:color-mix(in srgb,var(--tc) 9%,var(--surface))}
.tag-edit.new{border-style:dashed;--tc:var(--muted)}
.tag-edit .inp{height:28px;width:118px;border:0;background:transparent;padding:0 8px;border-radius:999px;font-size:13px;font-weight:600;color:color-mix(in srgb,var(--tc) 72%,var(--text));box-shadow:none}
.tag-edit .x{width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--faint);display:flex;align-items:center;justify-content:center;padding:0}
.tag-edit .x:hover{background:var(--surface2);color:var(--text)}
.tag-edit .x.armed{background:var(--bad);color:#fff}
.tag-edit .x svg{width:14px;height:14px}
.chip.tagc{--tc:var(--accent);background:linear-gradient(170deg,color-mix(in srgb,var(--tc) 18%,var(--gi1)),color-mix(in srgb,var(--tc) 10%,var(--gi2)));color:color-mix(in srgb,var(--tc) 78%,var(--text));border-color:color-mix(in srgb,var(--tc) 25%,transparent);box-shadow:0 1px 0 var(--giBorder) inset;font-weight:600}
.chip.tagc::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tc)}
.chip.known{background:var(--okBg);color:var(--ok);border-color:transparent}
.know{margin-top:6px;height:30px;padding:0 12px;border-radius:999px;border:1px dashed var(--lineStrong);background:transparent;font-size:12px;font-weight:600;color:var(--muted)}
.know.on{border:1px solid transparent;background:var(--okBg);color:var(--ok)}
#pop .scrim{z-index:35}
.popcard{position:fixed;z-index:36;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));max-height:calc(100% - 48px);overflow-y:auto;padding:22px 20px 20px;border-radius:28px;background:var(--bg);border:1px solid var(--line);box-shadow:0 30px 80px rgba(20,22,60,.28);display:flex;flex-direction:column;gap:16px;animation:popIn .4s cubic-bezier(.2,.8,.2,1) both}
.pop-x{position:absolute;right:10px;top:10px}
.pop-top{display:flex;gap:18px;align-items:center}
.pop-top svg.dia{width:120px;height:auto;color:var(--text);flex-shrink:0}
.pop-name{font-family:var(--fDisplay);font-size:44px;font-weight:600;line-height:1;letter-spacing:-.03em}
.pop-code{font-family:var(--fMono);font-size:16px;font-weight:600;color:var(--accentInk);margin-top:6px}
.pop-songs{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pop-song{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px 6px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;font-weight:500}
.pop-song small{margin-left:auto;color:var(--muted);font-size:12px}
.pop-song:hover{border-color:var(--lineStrong)}
@keyframes popIn{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%)}}

/* toolbar + list */
.bar{display:flex;gap:10px;align-items:center;margin-block:8px 14px;flex-wrap:wrap}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.search svg{width:17px;height:17px;color:var(--faint);flex-shrink:0}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;height:100%}
.filter-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 12px;border-radius:999px;background:var(--glowSoft);color:var(--accentInk);font-size:13px;font-weight:600;border:0}
.filter-chip svg{width:14px;height:14px}

.list{display:grid;gap:10px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:22px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both}
.card:hover{transform:translateY(-2px);border-color:var(--lineStrong);box-shadow:var(--shadow),0 14px 34px var(--glowSoft)}
.dotc{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--fDisplay);font-weight:600;font-size:13px;flex-shrink:0}
.card-main{min-width:0}
.card-main h3{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-main .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12px;font-weight:500;white-space:nowrap}
.chip.acc{background:var(--glowSoft);color:var(--accentInk);border-color:transparent;font-weight:600}
.chip.warn{background:var(--warnBg);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--okBg);color:var(--ok);border-color:transparent}
.card .chev{width:18px;height:18px;color:var(--faint)}

.empty{text-align:center;padding:26px 18px;border-radius:24px;border:1px dashed var(--lineStrong);color:var(--muted)}
.empty h3{color:var(--text);font-size:17px;margin-bottom:6px}
.empty p{margin:0 auto 14px;max-width:44ch}
.note-local{font-size:12px;color:var(--faint);text-align:center;margin-top:18px}

/* sheets */
.scrim{position:fixed;inset:0;z-index:20;background:var(--backdrop);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadeIn .3s ease both}
.sheet{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:-30px 0 80px rgba(20,22,60,.18);display:flex;flex-direction:column;animation:drawerIn .45s cubic-bezier(.2,.8,.2,1) both;overflow:hidden}
.sheet::before{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:360px;border-radius:50%;background:var(--sheetHue,var(--blob1));opacity:.28;filter:blur(90px);pointer-events:none}
.sheet-head{position:relative;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.sheet-head h2{font-size:16px;font-weight:600;margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{position:relative;flex:1;overflow-y:auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.sheet-foot{position:relative;display:flex;gap:10px;justify-content:flex-end;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}

/* song view */
.hero{display:flex;gap:16px;align-items:center}
.hero .dotc{width:64px;height:64px;font-size:18px;border:3px solid rgba(255,255,255,.85);box-shadow:0 12px 30px rgba(20,22,60,.18)}
.hero h1{font-size:26px;font-weight:600;line-height:1.15}
.hero p{margin:4px 0 0;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.meta > div{padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.meta label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.meta b{display:block;font-family:var(--fDisplay);font-size:20px;font-weight:600;line-height:1.2;margin-top:2px;white-space:nowrap}
.meta small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){.meta{grid-template-columns:repeat(2,1fr)}}

.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h3{font-size:14px;font-weight:600;margin-right:auto}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.seg button{height:32px;padding:0 13px;border:0;border-radius:999px;background:transparent;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--solid);color:var(--text);box-shadow:0 2px 8px rgba(20,22,60,.10)}

.chords{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.ccard{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}
.ccard .idx{position:absolute;left:12px;top:10px;font-size:11px;color:var(--faint);font-family:var(--fMono)}
.ccard .nm{font-family:var(--fDisplay);font-size:22px;font-weight:600;line-height:1.1}
.ccard .code{font-family:var(--fMono);font-size:13px;font-weight:600;color:var(--accentInk);letter-spacing:.02em}
.ccard .real{font-size:11.5px;color:var(--muted)}
.ccard svg.dia{width:92px;height:auto;color:var(--text)}
.mode-num .ccard .nm{font-size:15px;color:var(--muted)}
.mode-num .ccard .code{font-size:19px}

.strum{display:flex;gap:6px;flex-wrap:wrap}
.strum .sl{width:40px;height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--surface);border:1px solid var(--line);font-size:20px;font-weight:600}
.strum .sl small{font-size:10px;color:var(--faint);font-family:var(--fMono);font-weight:500}
.strum .sl.rest{color:var(--faint)}
.strum .sl.beat{border-color:var(--lineStrong)}
.strum .sl.cur{background:var(--accent);color:var(--onAccent);border-color:transparent;transform:translateY(-3px);box-shadow:0 10px 22px var(--glow)}
.strum .sl.cur small{color:var(--onAccent)}
.strum .sl{transition:transform .12s ease,background .12s ease}
.notes-box{padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;color:var(--text)}
.link-row{display:flex;gap:10px;flex-wrap:wrap}
.linkbtn{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 16px 0 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:var(--text);font-weight:500;font-size:14px;max-width:100%}
.linkbtn i{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1DB954;color:#fff;flex-shrink:0}
.linkbtn.sp-search{height:38px;align-self:flex-start;font-size:13px;box-shadow:none}
.linkbtn.sp-search i{width:26px;height:26px}
.linkbtn i.yt{background:#E11D48}
.linkbtn i.other{background:var(--accent);color:var(--onAccent)}
.linkbtn i svg{width:15px;height:15px}
.linkbtn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:var(--warnBg);color:var(--warn);font-size:14px}

/* editor */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.inp{height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);outline:none;width:100%;min-width:0}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glowSoft)}
textarea.inp{height:auto;min-height:92px;padding:12px 14px;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--muted)}
.hint.ok{color:var(--ok)}
.spbox{padding:14px;border-radius:20px;background:linear-gradient(160deg,rgba(29,185,84,.10),transparent 70%);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sp-logo{width:24px;height:24px;border-radius:50%;background:#1DB954;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sp-logo svg{width:13px;height:13px}
.sp-list{display:flex;flex-direction:column;gap:6px}
.sp-res{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px 8px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:border-color .15s ease,transform .15s ease}
.sp-res:hover{border-color:var(--lineStrong);transform:translateX(2px)}
.sp-res.on{border-color:#1DB954;box-shadow:0 0 0 3px rgba(29,185,84,.15)}
.sp-ico{width:36px;height:36px;border-radius:10px;background:rgba(29,185,84,.14);color:#1DB954;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sp-ico svg{width:16px;height:16px}
.sp-txt{min-width:0;flex:1;display:flex;flex-direction:column}
.sp-txt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-txt small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-res > small{color:var(--faint);font-size:12px}
@keyframes flash{0%,100%{box-shadow:var(--glassHi),var(--glassDrop)}30%{box-shadow:var(--glassHi),0 0 0 4px var(--accent),0 16px 40px var(--glow)}}
.card.flash{animation:flash 1.8s ease both}
.paste{padding:14px;border-radius:20px;background:linear-gradient(160deg,var(--glowSoft),transparent);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.paste h3{font-size:14px;font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-width:44px;height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;transition:transform .15s ease}
.pill:hover{transform:translateY(-1px)}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--onAccent);border-color:transparent;box-shadow:0 6px 16px var(--glow)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .inp{width:90px;text-align:center;font-family:var(--fDisplay);font-weight:600;font-size:18px}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slots button{width:44px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:600;padding:0}
.slots button small{font-size:10px;color:var(--faint);font-family:var(--fMono);font-weight:500}
.slots button.rest{color:var(--faint)}

.seq{display:flex;gap:8px;flex-wrap:wrap}
.seqi{display:inline-flex;align-items:center;gap:2px;height:40px;padding:0 4px 0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.seqi.sel{border-color:var(--accent);box-shadow:0 0 0 4px var(--glowSoft)}
.seqi .pick{border:0;background:none;padding:0 6px 0 0;display:flex;align-items:baseline;gap:6px;height:100%}
.seqi .pick b{font-family:var(--fDisplay);font-weight:600}
.seqi .pick span{font-family:var(--fMono);font-size:11.5px;color:var(--muted)}
.seqi .x{width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--faint);display:flex;align-items:center;justify-content:center;padding:0}
.seqi .x:hover{background:var(--surface2);color:var(--text)}
.seqi .x svg{width:14px;height:14px}

.builder{padding:14px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.fb-wrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
.fb{display:grid;grid-template-columns:44px 40px repeat(7,minmax(34px,1fr));min-width:340px;border-radius:14px;overflow:hidden}
.fb .h{font-size:10.5px;color:var(--faint);text-align:center;font-family:var(--fMono);padding-bottom:4px}
.fb .sn{display:flex;align-items:center;gap:4px;font-family:var(--fMono);font-size:12px;color:var(--muted);height:40px}
.fb .sn b{color:var(--text);font-weight:600}
.fb .st{height:40px;border:0;background:transparent;font-family:var(--fMono);font-weight:600;font-size:13px;color:var(--faint);border-right:3px solid var(--text);padding:0}
.fb .st.o{color:var(--ok)}
.fb .st.x{color:var(--bad)}
.fb .cell{position:relative;height:40px;border:0;background:transparent;padding:0;border-right:1px solid var(--lineStrong)}
.fb .cell::before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--sw,1px);background:var(--muted);opacity:.6;transform:translateY(-50%)}
.fb .cell i{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--accent);color:var(--onAccent);font-style:normal;font-family:var(--fMono);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px var(--glow);animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
.fb .cell:hover::after{content:"";position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--glowSoft)}
.fb .mark{position:absolute;left:50%;bottom:-2px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--faint);opacity:.5}
.detect{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.detect .big{font-family:var(--fDisplay);font-size:28px;font-weight:600;line-height:1}
.detect .code{font-family:var(--fMono);font-size:15px;font-weight:600;color:var(--accentInk)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{height:34px;min-width:44px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-family:var(--fDisplay);font-size:13px;font-weight:600}
.quick button:hover{border-color:var(--accent);color:var(--accentInk)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* practice */
.practice{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;animation:fadeIn .3s ease both;overflow:hidden}
.practice .ambient{position:absolute}
.pr-head{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px}
.pr-head h2{font-size:15px;font-weight:600;margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-main{position:relative;z-index:1;flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:8px 16px 16px}
.pr-now{display:flex;align-items:center;gap:26px;flex-wrap:wrap;justify-content:center}
.pr-name{font-family:var(--fDisplay);font-size:clamp(64px,16vw,120px);font-weight:600;line-height:.9;letter-spacing:-.04em;text-align:center}
.pr-code{font-family:var(--fMono);font-size:18px;color:var(--accentInk);text-align:center;margin-top:8px}
.pr-now svg.dia{width:150px;height:auto;color:var(--text)}
.pr-next{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.pr-next b{font-family:var(--fDisplay);color:var(--text);font-size:18px}
.beats{display:flex;gap:10px}
.beats i{width:14px;height:14px;border-radius:50%;background:var(--ring);transition:transform .1s,background .1s}
.beats i.on{background:var(--accent);transform:scale(1.35);box-shadow:0 0 0 6px var(--glowSoft)}
.pr-seq{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pr-seq span{height:30px;padding:0 12px;border-radius:999px;display:flex;align-items:center;background:var(--surface2);border:1px solid var(--line);font-family:var(--fDisplay);font-size:13px;font-weight:600;color:var(--muted)}
.pr-seq span.on{background:var(--accent);color:var(--onAccent);border-color:transparent}
.pr-ctrl{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 34px var(--glow);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.play:hover{transform:scale(1.06)}
.play svg{width:26px;height:26px}
.bpm{display:flex;align-items:center;gap:6px}
.bpm output{min-width:74px;text-align:center;font-family:var(--fDisplay);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.bpm output small{display:block;font-family:var(--fBody);font-size:11px;font-weight:500;color:var(--muted);line-height:1}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:40;transform:translateX(-50%);padding:11px 18px;border-radius:999px;background:var(--text);color:var(--bg);font-size:14px;font-weight:500;box-shadow:0 14px 34px rgba(0,0,0,.2);animation:toastIn .35s cubic-bezier(.2,.8,.2,1) both;max-width:calc(100% - 32px)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drawerIn{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s !important;animation-iteration-count:1 !important;transition-duration:.01s !important}}
@media (max-width:520px){.top .btn .lbl-long{display:none}.orbit{height:320px}.core{width:112px;height:112px;margin:-56px 0 0 -56px}.core strong{font-size:28px}}

/* ---- glass layer: frosted panels, hairline light edges, inner top highlight ---- */
:root{
  --glass:rgba(255,255,255,.34); --glass2:rgba(255,255,255,.2); --glassHover:rgba(255,255,255,.5);
  --glassEdge:rgba(255,255,255,.72); --glassEdgeSoft:rgba(255,255,255,.4);
  --glassHi:inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 1px rgba(255,255,255,.08);
  --glassDrop:0 10px 30px -12px rgba(40,46,120,.18);
  --blurG:blur(22px) saturate(1.7);
  --sheetBg:rgba(240,242,250,.55);
  --blob4:#DDD6FE;
  --surface:var(--glass); --surface2:var(--glass2);
  --shadow:var(--glassHi),var(--glassDrop);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --glass:rgba(255,200,170,.05); --glass2:rgba(255,200,170,.03); --glassHover:rgba(255,200,170,.09);
  --glassEdge:rgba(255,214,190,.15); --glassEdgeSoft:rgba(255,214,190,.08);
  --glassHi:inset 0 1px 0 rgba(255,225,205,.12),inset 0 0 0 1px rgba(255,255,255,.02);
  --glassDrop:0 14px 40px -14px rgba(0,0,0,.65);
  --sheetBg:rgba(16,9,6,.62); --blob4:#7C2D12;
  --surface:var(--glass); --surface2:var(--glass2); --shadow:var(--glassHi),var(--glassDrop)}}
:root[data-theme="dark"]{
  --glass:rgba(255,200,170,.05); --glass2:rgba(255,200,170,.03); --glassHover:rgba(255,200,170,.09);
  --glassEdge:rgba(255,214,190,.15); --glassEdgeSoft:rgba(255,214,190,.08);
  --glassHi:inset 0 1px 0 rgba(255,225,205,.12),inset 0 0 0 1px rgba(255,255,255,.02);
  --glassDrop:0 14px 40px -14px rgba(0,0,0,.65);
  --sheetBg:rgba(16,9,6,.62); --blob4:#7C2D12;
  --surface:var(--glass); --surface2:var(--glass2); --shadow:var(--glassHi),var(--glassDrop)}

/* richer field behind the glass so the frost has something to bend */
.ambient i{opacity:calc(var(--blobOp) + .1)}
.ambient::after{content:"";position:absolute;left:55%;top:-120px;width:460px;height:420px;border-radius:50%;background:var(--blob4);opacity:var(--blobOp);filter:blur(100px)}

.btn,.search,.inp,.seg,.card,.meta>div,.ccard,.strum .sl,.slots button,.pill,.quick button,.seqi,.builder,.paste,.spbox,.empty,.notes-box,.linkbtn,.sp-res,.pop-song,.chip,.know,.filter-chip,.fb-wrap,.tag-edit,.confirm{
  background-color:var(--glass);background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 60%);
  border:1px solid var(--glassEdgeSoft);border-top-color:var(--glassEdge);
  box-shadow:var(--glassHi);
  -webkit-backdrop-filter:var(--blurG);backdrop-filter:var(--blurG)}
.card,.meta>div,.ccard,.builder,.paste,.spbox,.linkbtn,.btn:not(.ghost){box-shadow:var(--glassHi),var(--glassDrop)}
.btn:hover,.pill:hover,.quick button:hover,.sp-res:hover,.pop-song:hover,.card:hover,.slots button:hover,.linkbtn:hover{background-color:var(--glassHover);border-color:var(--glassEdge)}
.btn.ghost{background-color:transparent;background-image:none;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.btn.ghost:hover{background-color:var(--glass2);border-color:var(--glassEdgeSoft)}
.btn.icon{border-color:var(--glassEdge)}
.btn.primary,.play,.pill[aria-pressed="true"],.strum .sl.cur,.seqi.sel .pick b{border-color:rgba(255,255,255,.28)}
.btn.primary,.play{background-color:var(--accent);background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 26px -8px var(--glow)}
.pill[aria-pressed="true"]{background-color:var(--accent);background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%)}
.seg button[aria-pressed="true"]{background:var(--glassHover);box-shadow:inset 0 1px 0 var(--glassEdge),0 2px 10px rgba(20,22,60,.08);border:1px solid var(--glassEdgeSoft)}
.inp{background-image:none}
.inp:focus{background-color:var(--glassHover);border-color:var(--accent)}
.search:focus-within{background-color:var(--glassHover);border-color:var(--glassEdge)}
.chip.acc,.chip.ok,.chip.warn,.chip.known,.chip.tagc,.know.on,.filter-chip{-webkit-backdrop-filter:none;backdrop-filter:none}
.chip.acc{background-color:var(--glowSoft);background-image:none}
.chip.ok,.chip.known,.know.on{background-color:var(--okBg);background-image:none;border-color:transparent}
.chip.warn{background-color:var(--warnBg);background-image:none;border-color:transparent}
.confirm{background-color:var(--warnBg)}
.fb-wrap{border-radius:16px;padding:8px}
.fb .cell,.fb .st{background:transparent}

/* sheets, popover and practice bars become frosted panes over the field */
.scrim{background:color-mix(in srgb,var(--backdrop) 70%,transparent)}
.sheet{background:var(--sheetBg);-webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8);border-left:1px solid var(--glassEdge);box-shadow:inset 1px 0 0 var(--glassEdgeSoft),-30px 0 80px rgba(20,22,60,.16)}
.sheet-head,.sheet-foot,.pr-ctrl{background:var(--glass2);-webkit-backdrop-filter:var(--blurG);backdrop-filter:var(--blurG);border-color:var(--glassEdgeSoft)}
.popcard{background:var(--sheetBg);-webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8);border:1px solid var(--glassEdge);box-shadow:var(--glassHi),0 30px 80px rgba(20,22,60,.25)}

/* tabs, panels, lessons, trainer, tuning */
.tabs{display:flex;justify-content:center;margin-block:10px 4px}
.tabs .seg button{height:38px;padding:0 20px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--onAccent);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.panel{padding:18px;border-radius:24px;margin-block:14px;background-color:var(--glass);background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 60%);border:1px solid var(--glassEdgeSoft);border-top-color:var(--glassEdge);box-shadow:var(--glassHi),var(--glassDrop);-webkit-backdrop-filter:var(--blurG);backdrop-filter:var(--blurG)}
.aulas-top{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-block:14px}
.aulas-top .panel{margin:0}
@media (max-width:620px){.aulas-top{grid-template-columns:1fr}}
.check-list{display:flex;flex-direction:column;gap:8px}
.check-row{display:flex;align-items:center;gap:10px;min-width:0}
.check{width:26px;height:26px;flex-shrink:0;border-radius:8px;border:1.5px solid var(--lineStrong);background:var(--glass);display:flex;align-items:center;justify-content:center;padding:0;color:#fff;transition:background .15s ease,border-color .15s ease}
.check:hover{border-color:var(--ok)}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.check svg{width:15px;height:15px}
.check-row.done .inp{text-decoration:line-through;color:var(--muted)}
.check-row .inp{flex:1;height:42px}
.check-row .x{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--faint);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.check-row .x:hover{background:var(--glass2);color:var(--text)}
.check-row .x svg{width:14px;height:14px}
.check-t{min-width:0;display:flex;flex-direction:column;font-size:14px}
.check-t small{font-size:12px;color:var(--faint)}
.add-item{align-self:flex-start;height:36px;font-size:13px}
.lesson-card .datebox{width:52px;height:56px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--glowSoft);color:var(--accentInk);flex-shrink:0}
.datebox b{font-family:var(--fDisplay);font-size:22px;line-height:1}
.datebox small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pair{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border-radius:20px;background-color:var(--glass);background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 60%);border:1px solid var(--glassEdgeSoft);border-top-color:var(--glassEdge);box-shadow:var(--glassHi);transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .2s}
.pair:hover{transform:translateY(-2px);background-color:var(--glassHover)}
.pair-n{display:flex;align-items:center;gap:10px;font-family:var(--fDisplay);font-size:22px;font-weight:600}
.pair-n.num{font-family:var(--fMono);font-size:18px;letter-spacing:.01em;color:var(--accentInk)}
.pair-alt{font-family:var(--fDisplay);font-size:13px;font-weight:600;color:var(--muted)}
.pair-n i{font-style:normal;color:var(--faint);font-size:16px}
.pair small{color:var(--muted);font-size:12px}
.pair-rec{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.pair-rec .mono{font-size:20px;font-weight:600;color:var(--accentInk)}
.inp.sel{width:auto;min-width:90px;height:40px;padding:0 10px}
.tune{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:520px){.tune{grid-template-columns:repeat(3,1fr)}}
.tune-str{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px 22px;border-radius:18px;background-color:var(--glass);border:1px solid var(--glassEdgeSoft);border-top-color:var(--glassEdge);box-shadow:var(--glassHi)}
.tune-str b{font-family:var(--fDisplay);font-size:24px;font-weight:600}
.tune-str small{font-size:11px;color:var(--muted);text-align:center}
.tune-str .tline{position:absolute;left:12%;right:12%;bottom:10px;height:var(--w);border-radius:2px;background:var(--muted);opacity:.5}
.tune-str.on{background-color:var(--glowSoft);border-color:var(--accent)}
.tune-str.on .tline{background:var(--accent);opacity:1;animation:vib .08s linear infinite alternate}
@keyframes vib{from{transform:translateY(-1px)}to{transform:translateY(1px)}}
.hear{margin-top:4px;height:30px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accentInk);background-color:var(--glass);border:1px solid var(--glassEdgeSoft);box-shadow:var(--glassHi)}
.hear svg{width:14px;height:14px}
.hear:hover{background-color:var(--glassHover)}
.btn.on-guide{color:var(--accentInk);border-color:var(--accent)}
.tr-pair{display:flex;align-items:center;gap:18px;justify-content:center;flex-wrap:wrap}
.tr-chord{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 18px;border-radius:24px;background-color:var(--glass);border:1px solid var(--glassEdgeSoft);border-top-color:var(--glassEdge);box-shadow:var(--glassHi);color:var(--text);transition:transform .2s ease,border-color .2s ease}
.tr-chord svg.dia{width:104px;height:auto}
.tr-chord b{font-family:var(--fDisplay);font-size:26px;font-weight:600}
.tr-chord.on{border-color:var(--accent);transform:scale(1.05);box-shadow:var(--glassHi),0 0 0 5px var(--glowSoft)}
.tr-swap{font-size:26px;color:var(--faint)}
.tr-dial{position:relative;width:min(230px,70vw);aspect-ratio:1;border-radius:50%;border:0;padding:0;background:transparent;max-width:100%}
.tr-dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tr-track{fill:var(--glass);stroke:var(--ring);stroke-width:10}
.tr-prog{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.tr-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tr-in strong{font-family:var(--fDisplay);font-size:64px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tr-in small{font-size:13px;color:var(--muted);margin-top:6px}
.tr-dial.run:active{transform:scale(.97)}
.tr-dial{transition:transform .1s ease}
.tr-hist{display:flex;align-items:flex-end;gap:6px;height:72px}
.tr-hist span{display:flex;flex-direction:column;align-items:center;gap:3px}
.tr-hist i{width:14px;height:var(--h);border-radius:5px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 40%,transparent))}
.tr-hist small{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}

.how{display:flex;flex-wrap:wrap;gap:8px 20px;margin:2px 0 0;padding:0;list-style:none;counter-reset:h;font-size:13.5px;color:var(--muted)}
.how li{display:flex;align-items:center;gap:8px;counter-increment:h}
.how li::before{content:counter(h);width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--glowSoft);color:var(--accentInk);font-size:12px;font-weight:700;flex-shrink:0}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.path-c{height:32px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;font-family:var(--fDisplay);font-weight:600;font-size:14px;background-color:var(--glass);border:1px solid var(--glassEdgeSoft);white-space:nowrap}
.path-c.mono{font-family:var(--fMono);font-size:13px;color:var(--accentInk)}
.path i{font-style:normal;color:var(--faint)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:52px 1fr auto 40px;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 12px 12px 14px;border-radius:18px;background-color:var(--glass);background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 60%);border:1px solid var(--glassEdgeSoft);border-top-color:var(--glassEdge);box-shadow:var(--glassHi);transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .2s}
.step:hover{transform:translateX(3px);background-color:var(--glassHover)}
.step.focus{border-color:var(--accent);box-shadow:var(--glassHi),0 0 0 4px var(--glowSoft)}
.step-i{font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.step-m{min-width:0;display:flex;flex-direction:column}
.step-n{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--fDisplay);font-size:20px;font-weight:600}
.step-n b{white-space:nowrap}
.step-n.mono{font-family:var(--fMono);font-size:17px;color:var(--accentInk)}
.step-n i{font-style:normal;color:var(--faint);font-size:15px}
.step-m small{font-size:12.5px;color:var(--muted);font-weight:600}
.step-r{display:flex;flex-direction:column;align-items:flex-end}
.step-r b{font-size:20px;color:var(--accentInk)}
.step-r small{font-size:11.5px;color:var(--faint)}
.step-r .go{color:var(--accentInk);font-weight:600}
.step-go{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--onAccent)}
.step-go svg{width:16px;height:16px}
.step:not(.focus) .step-go{background:var(--glass2);color:var(--accentInk);border:1px solid var(--glassEdgeSoft)}
@media (max-width:480px){.step{grid-template-columns:40px 1fr auto}.step-go{display:none}}
.free{margin-top:16px;font-size:14px}
.free summary{cursor:pointer;color:var(--muted);font-weight:600}

.tr-main{justify-content:flex-start;gap:18px;padding-top:4px}
.tr-flow{display:flex;align-items:center;gap:14px}
.tr-mini{display:flex;flex-direction:column;align-items:center;min-width:120px;padding:10px 16px;border-radius:20px;background-color:var(--glass);border:1px solid var(--glassEdgeSoft);border-top-color:var(--glassEdge);box-shadow:var(--glassHi);color:var(--text)}
.tr-mini small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600}
.tr-mini b{font-family:var(--fDisplay);font-size:24px;font-weight:600;line-height:1.2}
.tr-mini b.mono{font-family:var(--fMono);font-size:20px;color:var(--accentInk)}
.tr-mini span{font-size:12px;color:var(--muted);font-weight:600;min-height:16px}
.tr-mini.now{border-color:var(--accent);box-shadow:var(--glassHi),0 0 0 4px var(--glowSoft)}
.tr-arrow{font-size:24px;color:var(--accent)}
.tr-teach{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;max-width:720px;padding:18px;border-radius:26px;background-color:var(--glass);border:1px solid var(--glassEdgeSoft);border-top-color:var(--glassEdge);box-shadow:var(--glassHi),var(--glassDrop);animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both}
.tr-dia{display:flex;flex-direction:column;align-items:center;gap:8px}
.mvdia{width:210px;height:auto;color:var(--text);max-width:100%}
.mv-path{animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.mv-target{animation:tgt 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tgt{0%,100%{opacity:.55}50%{opacity:1}}
.mv-keep{animation:keep 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes keep{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.15);opacity:.4}}
.mv-legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:11.5px;color:var(--muted)}
.mv-legend span{display:inline-flex;align-items:center;gap:5px}
.mv-legend i{width:10px;height:10px;border-radius:50%}
.l-cur{background:var(--accent)}
.l-tgt{border:1.5px dashed var(--accent);background:var(--glowSoft)}
.l-keep{background:var(--ok)}
.mv-steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;max-width:320px;counter-reset:m}
.mv-steps li{position:relative;padding:10px 12px 10px 40px;border-radius:14px;background:var(--glass2);border:1px solid var(--glassEdgeSoft);font-size:14px;line-height:1.4;counter-increment:m}
.mv-steps li::before{content:counter(m);position:absolute;left:10px;top:10px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--glowSoft);color:var(--accentInk)}
.mv-steps li.mv-keep::before{background:var(--okBg);color:var(--ok)}
.mv-steps li.mv-lift::before,.mv-steps li.mv-mute::before{background:rgba(185,28,28,.12);color:var(--bad)}
.cpos{display:inline-block;padding:1px 6px;border-radius:6px;background:var(--glowSoft);color:var(--accentInk);font-weight:600;font-size:12.5px}
.tr-bottom{display:flex;align-items:center;gap:24px;justify-content:center;flex-wrap:wrap}
.tr-bottom .tr-dial{width:180px}
.tr-bottom .tr-in strong{font-size:52px}
.tr-side{display:flex;flex-direction:column;gap:12px;max-width:300px;align-items:flex-start}

.lyrics{display:flex;flex-direction:column;gap:2px;padding:16px 18px;border-radius:20px;background-color:var(--glass);border:1px solid var(--glassEdgeSoft);border-top-color:var(--glassEdge);box-shadow:var(--glassHi);font-size:16px;line-height:1.3}
.ly-line{display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:.32em;row-gap:4px;padding:3px 6px;border-radius:10px;transition:background .25s ease}
.ly-line.cur{background:var(--glowSoft)}
.ly-gap{height:14px}
.ly-w{display:inline-flex;flex-direction:column;align-items:flex-start;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.ly-c{font-style:normal;font-family:var(--fDisplay);font-size:13px;font-weight:700;color:var(--accentInk);min-height:17px;line-height:17px;white-space:nowrap}
.ly-c.mono{font-family:var(--fMono);font-size:12px}
.lyrics:not(.editing) .ly-w:not(.has) .ly-c{min-height:17px}
.ly-w.cur span{background:var(--accent);color:var(--onAccent);border-radius:6px;padding:0 4px;margin:0 -4px}
.editing .ly-w{cursor:pointer;border-radius:8px;padding:0 3px;margin:0 -3px;transition:background .15s ease}
.editing .ly-w:hover{background:var(--glowSoft)}
.editing .ly-w:not(.has) .ly-c::before{content:"+";opacity:0;color:var(--faint)}
.editing .ly-w:hover:not(.has) .ly-c::before{opacity:1}
.ly-palette{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;margin-bottom:10px;border-radius:18px;background:var(--sheetBg);-webkit-backdrop-filter:var(--blurG);backdrop-filter:var(--blurG);border:1px solid var(--glassEdge)}
.ly-pick{height:36px;min-width:44px;padding:0 14px;border-radius:999px;border:1px solid var(--glassEdgeSoft);background:var(--glass);font-family:var(--fDisplay);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.ly-pick.mono{font-family:var(--fMono);font-size:13px}
.ly-pick.on{background:var(--accent);color:var(--onAccent);border-color:transparent;box-shadow:0 6px 16px -6px var(--glow)}
.ly-pick.erase svg{width:13px;height:13px}
.ly-pick.erase.on{background:var(--bad)}
.pr-lyrics{width:100%;max-width:640px;max-height:34vh;overflow-y:auto;font-size:18px}

.riff{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:20px;background-color:var(--glass);border:1px solid var(--glassEdgeSoft);border-top-color:var(--glassEdge);box-shadow:var(--glassHi);margin-bottom:10px}
.riff-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.riff-h b{font-family:var(--fDisplay);font-weight:600}
.tab-wrap{overflow-x:auto;padding-bottom:4px}
.tab{display:grid;grid-auto-rows:24px;min-width:max-content;font-family:var(--fMono);font-variant-numeric:tabular-nums}
.tab-l{display:flex;align-items:center;font-size:11px;color:var(--faint);font-weight:600}
.tab-c{position:relative;display:flex;align-items:center;justify-content:center}
.tab-c::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--muted);opacity:.45}
.tab-c b{position:relative;min-width:22px;height:20px;padding:0 4px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--onAccent);font-size:12px;transition:transform .12s ease,box-shadow .12s ease}
.tab-t{display:flex;align-items:flex-end;justify-content:center;font-size:13px;color:var(--accentInk);font-weight:700}
.tab-c.play b{transform:scale(1.3);box-shadow:0 0 0 4px var(--glowSoft),0 6px 14px var(--glow)}
.riff-codes{display:flex;flex-wrap:wrap;gap:4px;font-size:12.5px;color:var(--muted);align-items:center}
.riff-codes i{font-style:normal;opacity:.5}
.riff-codes span.play{color:var(--accentInk);font-weight:700}

.paste-legend{display:flex;flex-wrap:wrap;gap:6px}
.paste-legend span{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:12px;background:var(--glass2);border:1px solid var(--glassEdgeSoft);font-size:12px;color:var(--muted)}
.paste-legend b{padding:2px 7px;border-radius:7px;background:var(--glowSoft);color:var(--accentInk);font-size:12px;font-weight:600}
.notes-field .inp{min-height:96px}
.tab-t small{font-size:9.5px;color:var(--faint);font-weight:600}

.ly-sec{font-family:var(--fDisplay);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accentInk);margin:12px 6px 2px}
.ly-sec:first-child{margin-top:0}
.ly-sum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:var(--okBg);color:var(--ok);font-size:13.5px;font-weight:500}
.ly-sum span{flex:1;min-width:160px}
.ly-sum .btn{height:34px;color:var(--text)}
#ed-lyrics{font-family:var(--fMono);font-size:13px;line-height:1.5;white-space:pre;overflow-x:auto}

a.btn{text-decoration:none;color:var(--text)}
a.btn.primary{color:var(--onAccent)}
a.tag{text-decoration:none}
.tag.ext{height:32px;padding:0 12px 0 10px;font-size:12.5px}
.imp{margin-block:4px 14px;padding:14px;border-radius:24px;background-color:var(--glass);background-image:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 60%);border:1px solid var(--glassEdgeSoft);border-top-color:var(--glassEdge);box-shadow:var(--glassHi),var(--glassDrop);-webkit-backdrop-filter:var(--blurG);backdrop-filter:var(--blurG);display:flex;flex-direction:column;gap:12px}
.imp-row{display:flex;gap:10px;align-items:center}
.imp-search{flex:1 1 auto;box-shadow:none}
.imp-ico{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.imp-search .imp-ico svg{width:14px;height:14px;color:var(--onAccent)}
.imp-res{display:flex;flex-direction:column;gap:8px}
.imp-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.imp-head > span{font-weight:600}
.imp-head .btn{margin-left:auto;height:36px;width:36px}
.imp-links{display:flex;flex-wrap:wrap;gap:6px}
.imp-item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--glass2);border:1px solid var(--glassEdgeSoft)}
.imp-cover{width:52px;height:52px;border-radius:12px;object-fit:cover;max-width:100%}
.imp-cover.ph{display:flex;align-items:center;justify-content:center;background:var(--glowSoft);color:var(--accentInk)}
.imp-cover.ph svg{width:20px;height:20px}
.imp-txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.imp-txt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-txt small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-txt .imp-links{margin-top:6px}
.imp-item .btn{height:40px;padding:0 14px}
@media (max-width:520px){.imp-item{grid-template-columns:44px 1fr}.imp-cover{width:44px;height:44px}.imp-item > .btn{grid-column:1 / -1}}
.imp-hint{padding:14px;border-radius:18px;background:var(--glowSoft);color:var(--text);font-size:14px;line-height:1.45;display:flex;flex-direction:column;gap:10px}


.brand-orb{background:none!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;width:48px;height:48px;border-radius:0;overflow:visible}
.brand-orb .lg{width:48px;height:48px;overflow:visible}
.lg{animation:lgIn .9s cubic-bezier(.2,.8,.2,1) both}
.lg-flow{animation:lgFlow 7s linear infinite}

<script>
(() => {
/* ---------- music model ---------- */
const OPEN = {1:64,2:59,3:55,4:50,5:45,6:40};          // e B G D A E (MIDI)
const SNAME = {1:'e',2:'B',3:'G',4:'D',5:'A',6:'E'};
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT = {Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};
const LIB = {
  'C':[[5,3],[4,2],[2,1]], 'Cmaj7':[[5,3],[4,2]], 'C7':[[5,3],[4,2],[3,3],[2,1]],
  'D':[[3,2],[1,2],[2,3]], 'Dm':[[3,2],[2,3],[1,1]], 'D7':[[3,2],[2,1],[1,2]], 'Dsus4':[[3,2],[2,3],[1,3]], 'Dsus2':[[3,2],[2,3]],
  'E':[[5,2],[4,2],[3,1]], 'Em':[[5,2],[4,2]], 'E7':[[5,2],[3,1]], 'Em7':[[5,2]],
  'F':[[4,3],[3,2],[2,1],[1,1]], 'Fmaj7':[[4,3],[3,2],[2,1]],
  'G':[[6,3],[5,2],[1,3]], 'G7':[[6,3],[5,2],[1,1]],
  'A':[[4,2],[3,2],[2,2]], 'Am':[[4,2],[3,2],[2,1]], 'A7':[[4,2],[2,2]], 'Am7':[[4,2],[2,1]], 'Asus2':[[4,2],[3,2]], 'Asus4':[[4,2],[3,2],[2,3]],
  'B7':[[5,2],[4,1],[3,2],[1,2]], 'Bm':[[5,2],[4,4],[3,4],[2,3],[1,2]]
};
const LIB_MUTE = {C:[6],Cmaj7:[6],C7:[6],D:[6,5],Dm:[6,5],D7:[6,5],Dsus4:[6,5],Dsus2:[6,5],F:[6,5],Fmaj7:[6,5],A:[6],Am:[6],A7:[6],Am7:[6],Asus2:[6],Asus4:[6],B7:[6],Bm:[6]};
const QUICK = ['C','D','Dm','E','Em','F','G','A','Am','Bm','B7','Cmaj7','Em7','Am7','D7','G7','A7','E7'];
const TEMPL = [['',[0,4,7]],['m',[0,3,7]],['7',[0,4,7,10]],['maj7',[0,4,7,11]],['m7',[0,3,7,10]],['sus2',[0,2,7]],['sus4',[0,5,7]],['dim',[0,3,6]],['add9',[0,2,4,7]],['6',[0,4,7,9]],['m6',[0,3,7,9]],['5',[0,7]]];
const HUES = ['#4F46E5','#DB2777','#0284C7','#C2410C','#047857','#7C3AED','#E11D48','#0F766E'];

const posKey = pos => pos.map(([s,f]) => s+':'+f).sort().join(',');
const LIBKEY = Object.fromEntries(Object.entries(LIB).map(([n,p]) => [posKey(p), n]));

function chordFromName(name){
  const n = normName(name); if (!LIB[n]) return null;
  return {pos: LIB[n].map(x => x.slice()), mute:(LIB_MUTE[n]||[]).slice(), open:[]};
}
function normName(n){ n = (n||'').trim(); const m = n.match(/^([A-Ga-g])([#b]?)(.*)$/); if(!m) return n; return m[1].toUpperCase()+m[2]+m[3]; }

function detect(ch){
  if (!ch || !ch.pos || !ch.pos.length) return (ch && ch.pos && !ch.pos.length && (ch.open||[]).length) ? analyze(ch) : '';
  if (ch.name) return ch.name;
  const k = LIBKEY[posKey(ch.pos)]; if (k) return k;
  return analyze(ch) || '?';
}
function analyze(ch){
  const fr = {}; ch.pos.forEach(([s,f]) => fr[s]=f);
  const bass = ch.pos.length ? Math.max(...ch.pos.map(p=>p[0])) : 6;
  const notes = [];
  for (let s=6; s>=1; s--){
    if (fr[s]!=null) notes.push(OPEN[s]+fr[s]);
    else if ((ch.mute||[]).includes(s)) continue;
    else if ((ch.open||[]).includes(s) || s < bass) notes.push(OPEN[s]);
  }
  if (!notes.length) return '';
  const bassPc = notes[0] % 12; const pcs = [...new Set(notes.map(n=>n%12))];
  let best = null;
  for (const r of pcs){
    const iv = pcs.map(p => (p-r+12)%12).sort((a,b)=>a-b).join(',');
    for (const [suf,t] of TEMPL){ if (t.join(',')===iv){ const cand = {r,suf,score:(r===bassPc?2:0)+(suf.length<3?1:0)}; if(!best||cand.score>best.score) best=cand; } }
  }
  if (!best) return '';
  return NOTES[best.r]+best.suf+(best.r!==bassPc?'/'+NOTES[bassPc]:'');
}
function transposeName(name, st){
  if (!name || name==='?' || !st) return name;
  return name.replace(/([A-G])([#b]?)/g, (m,a,b) => { let i = NOTES.indexOf(FLAT[a+b]||a+b); if(i<0) return m; return NOTES[(i+st)%12]; });
}
const codeOf = ch => (ch.pos||[]).map(([s,f]) => ''+s+f).join('-') || (ch.open&&ch.open.length ? 'solto' : '');

/* parse teacher shorthand "21-42-32" (string then fret). "421" = 42 + 21 */
function parseCode(str){
  const toks = str.split(/[-\s,]+/).map(t=>t.trim()).filter(Boolean);
  const pos = []; const seen = new Set();
  for (const t of toks){
    if (!/^\d+$/.test(t)) return null;
    const pairs = [];
    if (t.length===2) pairs.push(t);
    else if (t.length===3) { pairs.push(t.slice(0,2), t.slice(1,3)); }
    else if (t.length%2===0) for(let i=0;i<t.length;i+=2) pairs.push(t.slice(i,i+2));
    else return null;
    for (const p of pairs){ const s=+p[0], f=+p[1]; if(s<1||s>6) return null; if(seen.has(s)) continue; seen.add(s); pos.push([s,f]); }
  }
  return pos.length ? {pos, mute:[], open:[]} : null;
}
function parseChordInput(str){
  str = (str||'').trim(); if(!str) return null;
  if (/^[\d\s\-,]+$/.test(str)) return parseCode(str);
  return chordFromName(str);
}
const NOTE_RE = /^([1-6])(\d{1,2})([↑↓^vVhHpPbB\/\\~*]*)$/;
const TECH_MAP = {'^':'↑','v':'↓','V':'↓'};
function parseNoteTok(t){ const m = t.match(NOTE_RE); if (!m) return null; const f = +m[2]; if (f>22) return null; return {s:+m[1], f, t:(m[3]||'').split('').map(c=>TECH_MAP[c]||c).join('')}; }
function parseRiffText(line){
  const toks = line.replace(/[-–—_]{2,}/g,' _ ').replace(/[·•∙|,;.]+/g,' ').replace(/\s*-\s*/g,' ').trim().split(/\s+/).filter(Boolean);
  if (toks.filter(t=>t!=='_').length < 2) return null;
  const notes = toks.map(t => t==='_' ? {rest:true} : parseNoteTok(t)); if (notes.some(n=>!n)) return null;
  while (notes.length && notes[0].rest) notes.shift(); return notes;
}
function parseStrumText(line){
  const l = line.replace(/[·•∙|,]/g,' ').replace(/[xX×]/g,'x').trim();
  if (!/[↓↑]/.test(l) || /[^↓↑x\s_\-]/.test(l)) return null;
  const groups = l.split(/\s+/).filter(Boolean); const out = [];
  groups.forEach(g => { const c = g.replace(/[_\-]/g,'').split('').map(ch => ch==='↓'?'D':ch==='↑'?'U':'X');
    if (c.length===1) out.push(...(c[0]==='U'?['','U']:[c[0],''])); else { if (c.length%2 && c[0]==='U') out.push(''); out.push(...c); if (out.length%2) out.push(''); } });
  return out.length ? out : null;
}
const riffToText = r => (r.label?r.label+': ':'') + (r.notes||[]).map(n=>n.rest?'--':''+n.s+n.f+(n.t||'')).join(' ');
function parseMessage(txt){
  const out = {chords:[], riffs:[], extra:[]};
  const url = txt.match(/https?:\/\/\S+/); if (url) out.link = url[0].replace(/[)\].,]+$/,'');
  const capo = txt.match(/capo(?:traste)?\s*(?:na\s*|casa\s*|:\s*)?(\d{1,2})/i); if (capo) out.capo = +capo[1];
  const bpm = txt.match(/(\d{2,3})\s*bpm/i); if (bpm) out.bpm = +bpm[1];
  let pendingLabel = '', groupLabel = '', groupCount = 0;
  txt.split(/\n/).forEach(line => {
    let l = line.trim(); if (!l){ groupLabel=''; groupCount=0; return; } if (/https?:/.test(l)) return;
    l = l.replace(/capo(?:traste)?\s*(?:na\s*|casa\s*|:\s*)?\d{1,2}ª?/ig,'').replace(/\d{2,3}\s*bpm/ig,'').trim(); if (!l || /^[\s\-–—:·,.;|]*$/.test(l)) return;
    let label = ''; const lm = l.match(/^([^\d↓↑:]{2,24}):\s*(.+)$/); if (lm){ label = lm[1].trim(); l = lm[2].trim(); }
    const st = parseStrumText(l); if (st){ out.strum = st; pendingLabel=''; return; }
    if (/^[\d\s\-]+$/.test(l) && /\d{2}-\d/.test(l) && !/\s/.test(l.replace(/\s*-\s*/g,'-'))){ const c = parseCode(l); if (c){ out.chords.push(c); pendingLabel=''; return; } }
    const rf = parseRiffText(l); if (rf){
      if (label || pendingLabel){ groupLabel = label || pendingLabel; groupCount = 0; }
      groupCount++;
      const lab = groupLabel ? groupLabel + (groupCount>1 ? ' · parte '+groupCount : '') : '';
      out.riffs.push({label: lab, notes: rf}); pendingLabel=''; return; }
    if (/^[\d\s\-]+$/.test(l) && /\d{2}/.test(l)){ const c = parseCode(l); if (c){ out.chords.push(c); return; } }
    const names = l.split(/[\s|,]+/).filter(Boolean);
    if (names.length && names.every(n => /^[A-Ga-g][#b]?(m|maj7|m7|7|sus2|sus4|dim|add9|6|m6|5)?$/.test(n))){ names.forEach(n => { const c = chordFromName(n); out.chords.push(c || {pos:[],mute:[],open:[],name:normName(n)}); }); return; }
    if (l.length <= 24 && !/\d{2}/.test(l) && !/\s\S+\s\S+\s\S+/.test(l)) { pendingLabel = l.replace(/[:\-]+$/,'').trim(); return; }
    out.extra.push(line.trim());
  });
  return out;
}
function linkInfo(url){
  if(!url) return null;
  let m = url.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album|playlist)\/([A-Za-z0-9]+)/);
  if (m) return {kind:'spotify', label:'Ouvir no Spotify', id:m[2]};
  if (/open\.spotify\.com\/search\//.test(url)) return {kind:'spotify', label:'Procurar no Spotify'};
  if (/youtu\.?be/.test(url)) return {kind:'yt', label:'Ver no YouTube'};
  if (/cifraclub|cifras/.test(url)) return {kind:'other', label:'Abrir cifra'};
  return {kind:'other', label:'Abrir link'};

async function spSearch(q){
  if (!ed) return; q = (q||'').trim(); if (!q) return;
  ed.sp = {q, loading:true, results:[], err:''}; rerender();
  try {
    const r = await mcp.callTool('Spotify', 'search', {prompt:q, language:'pt-BR'});
    let p = r && r.payload; if (typeof p === 'string'){ try { p = JSON.parse(p); } catch(e){} }
    const tracks = parseMusic(p);
    if (!ed) return;
    ed.sp = {q, loading:false, results:tracks, err: tracks.length ? '' : 'Nenhuma faixa encontrada. Tente o nome da música com o artista.'};
  } catch(err){
    if (!ed) return;
    const c = err && err.code;
    const msg = c==='server_not_connected'||c==='server_not_found'||c==='needs_reauth' ? 'O Spotify não está conectado na sua conta do Claude. Conecte em Configurações, Conectores.'
      : c==='consent_required'||c==='not_granted'||c==='approval_required' ? 'Para buscar, permita que o Fluid use o seu Spotify.'
      : c==='rate_limited' ? 'Muitas buscas seguidas. Espere alguns segundos.'
      : 'A busca no Spotify falhou agora. Tente de novo.';
    ed.sp = {q, loading:false, results:[], err:msg};
  }
  rerender(); const i = document.getElementById('sp-q'); i && i.focus();
}
const fmtMs = ms => ms ? Math.floor(ms/60000)+':'+String(Math.round(ms/1000)%60).padStart(2,'0') : '';
async function initStore(){
  let cap = null;
  try { cap = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch(e){ cap = null; }
  const local = () => { mode='local'; songs = lsLoad(); progress = lsGet(LSP,{mastered:[]}); tagMeta = lsGet(LST,{tags:[]}); lessons = lsGet(LSL,[]); changes = lsGet(LSC,{pairs:{}}); render(); };
  if (!cap) return local();
  db = cap; mode = 'db';
  db.collection('songs').onSnapshot(snap => {
    songs = snap.docs.map(d => ({id:d.id, ...JSON.parse(JSON.stringify(d.data()))}))
      .sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
    render(); if (view.sheet==='song') refreshSheet();
  }, local);
  db.doc('meta/progress').onSnapshot(d => { progress = d.exists ? {mastered:[], ...JSON.parse(JSON.stringify(d.data()))} : {mastered:[]}; render(); if (view.sheet==='song') refreshSheet(); if (pop.chord) showPop(pop.chord); if (practice) renderPractice(); }, ()=>{});
  db.collection('lessons').onSnapshot(snap => { lessons = snap.docs.map(d => ({id:d.id, ...JSON.parse(JSON.stringify(d.data()))})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||'').localeCompare(a.createdAt||'')); if (view.tab!=='musicas' || !view.sheet) render(); }, ()=>{});
  db.doc('meta/changes').onSnapshot(d => { changes = d.exists ? {pairs:{}, ...JSON.parse(JSON.stringify(d.data()))} : {pairs:{}}; if (view.tab==='treino') render(); }, ()=>{});
  db.doc('meta/tags').onSnapshot(d => { tagMeta = d.exists ? {tags:[], ...JSON.parse(JSON.stringify(d.data()))} : {tags:[]}; render(); }, ()=>{});
}

const isMastered = n => (progress.mastered||[]).includes(n);
function setMastered(n, on){
  const set = new Set(progress.mastered||[]); on ? set.add(n) : set.delete(n);
  progress = {...progress, mastered:[...set]}; saveMeta('progress'); render();
  toast(on ? n+' foi para o anel de dentro' : n+' voltou para aprendendo');
}
const isRealChord = c => !!c && ((c.pos||[]).length + (c.open||[]).length >= 2 || (!!c.name && !(c.pos||[]).length));
const songNames = s => (s.chords||[]).filter(isRealChord).map(detect).filter(n=>n && n!=='?');
const isReady = s => { const n = songNames(s); return n.length>0 && n.every(isMastered); };
const TAGC = ['#DB2777','#7C3AED','#0284C7','#059669','#EA580C','#CA8A04','#4F46E5','#0D9488','#E11D48','#65A30D'];
const tagColor = t => { const i = allTags().indexOf(t); return TAGC[(i<0 ? [...t].reduce((a,c)=>a+c.charCodeAt(0),0) : i) % TAGC.length]; };
const tagStyle = t => `--tc:${tagColor(t)}`;
function allTags(){
  const out = [...(tagMeta.tags||[])];
  songs.forEach(s => (s.tags||[]).forEach(t => { if (!out.some(x=>x.toLowerCase()===t.toLowerCase())) out.push(t); }));
  return out;
}
async function addTag(name){
  name = (name||'').trim().replace(/\s+/g,' ').slice(0,24); if (!name) return null;
  const ex = allTags().find(t=>t.toLowerCase()===name.toLowerCase()); if (ex) return ex;
  tagMeta = {...tagMeta, tags:[...(tagMeta.tags||[]), name]}; await saveMeta('tags'); return name;
}
async function renameTag(oldN, newN){
  newN = (newN||'').trim().replace(/\s+/g,' ').slice(0,24); if (!newN || newN===oldN) return;
  if (!allTags().includes(oldN)) return;
  tagMeta = {...tagMeta, tags: [...new Set([...(tagMeta.tags||[]).map(t=>t===oldN?newN:t), newN])]};
  saveMeta('tags');
  for (const s of songs){ if ((s.tags||[]).includes(oldN)){ s.tags = [...new Set(s.tags.map(t=>t===oldN?newN:t))]; if (db) writeSong(s); } }
  if (!db) lsSave();
  if (view.tagFilter===oldN) view.tagFilter = newN;
  render(); toast('Pastilha renomeada');
}
async function removeTag(name){
  tagMeta = {...tagMeta, tags:(tagMeta.tags||[]).filter(t=>t!==name)}; saveMeta('tags');
  for (const s of songs){ if ((s.tags||[]).includes(name)){ s.tags = s.tags.filter(t=>t!==name); if (db) writeSong(s); } }
  if (!db) lsSave();
  if (view.tagFilter===name) view.tagFilter = null;
  render(); toast('Pastilha apagada');
}

const codeFor = {}, shapeFor = {};
const label = c => { const n = detect(c); return view.display==='num' ? (codeOf(c) || n) : n; };
function chordStats(){
  const count = {};
  songs.forEach(s => { const seen = new Set(); (s.chords||[]).filter(isRealChord).forEach(c => { const n = detect(c); if(!n || n==='?' || seen.has(n)) return; seen.add(n); count[n]=(count[n]||0)+1; if(!shapeFor[n] && (c.pos||[]).length){ shapeFor[n]=c; codeFor[n]=codeOf(c); } }); });
  const names = Object.keys(count).sort((a,b)=>count[b]-count[a]||a.localeCompare(b)).slice(0,18);
  return {count, names};
}
function filtered(){
  const q = view.q.trim().toLowerCase();
  return songs.filter(s => {
    if (view.chordFilter && !(s.chords||[]).some(c=>detect(c)===view.chordFilter)) return false;
    if (view.tagFilter && !(s.tags||[]).includes(view.tagFilter)) return false;
    if (view.readyFilter && !isReady(s)) return false;
    if (!q) return true;
    return [s.title,s.artist,s.notes,(s.tags||[]).join(' '),(s.chords||[]).map(c=>detect(c)+' '+codeOf(c)).join(' ')].join(' ').toLowerCase().includes(q);
  });
}
function chordSat(c, i, ring, count){
  const txt = view.display==='num' && codeFor[c] ? codeFor[c] : c;
  const k = Math.min(1.4, .82 + .18*((count[c]||1)-1));
  return `<button class="sat${view.chordFilter===c?' on':''}" data-orb="${ring}" data-i="${i}" data-k="${k.toFixed(2)}" data-pop="${esc(c)}" aria-label="${esc(c)}: ${isMastered(c)?'você já sabe':'aprendendo'}, usado em ${count[c]} ${count[c]===1?'música':'músicas'}" title="${esc(c)}${codeFor[c]?' · '+esc(codeFor[c]):''} · ${count[c]} ${count[c]===1?'música':'músicas'}"><span class="s-chord${ring==='known'?' known':''}${txt!==c?' mono':''}">${esc(txt)}${count[c]>1?`<span class="s-n">×${count[c]}</span>`:''}</span></button>`;
}

function songCard(s,i){

  return `<button class="card" data-open="${esc(s.id)}" style="animation-delay:${Math.min(i,8)*40}ms">
    <span class="dotc" style="background:${hueOf(s)}">${esc(initials(s.title))}</span>

        ${s.bpm?`<span class="chip">${s.bpm} bpm</span>`:''}
      </span></span>${I.chev}</button>`;
}

      <div class="pop-songs">${users.map(s=>`<button class="pop-song" data-pop-open="${esc(s.id)}"><span class="dotc" style="background:${hueOf(s)};width:28px;height:28px;font-size:10px">${esc(initials(s.title))}</span>${esc(s.title||'Sem título')}${s.capo?`<small>capo ${s.capo}</small>`:''}</button>`).join('')}</div></div>

      <button class="btn" data-pop-hear>${I.speaker}Ouvir</button>

/* ---------- orbit animation: three tilted rings with depth, pauses on hover ---------- */
let orbitRAF = 0;
function startOrbit(){
  cancelAnimationFrame(orbitRAF);
  const el = document.getElementById('orbit'); if (!el) return;
  const sats = [...el.querySelectorAll('.sat')];
  const by = k => sats.filter(s=>s.dataset.orb===k);
  const songsS = by('song'), learnS = by('learn'), knownS = by('known');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let paused = false; el.onmouseenter=()=>paused=true; el.onmouseleave=()=>paused=false;
  el.addEventListener('focusin',()=>paused=true); el.addEventListener('focusout',()=>paused=false);
  let t0 = performance.now(), phase = (window.__fluidPhase||0);
  const place = () => {
    const w = el.clientWidth, h = el.clientHeight, cx = w/2, cy = h/2 - 10;
    const R = Math.min(w*0.47, 340), r = R*0.36;
    const R2 = R*0.70, r2 = R2*0.36, R3 = R*0.42, r3 = R3*0.40;
    [['.r1',R,r],['.r2',R2,r2],['.r3',R3,r3]].forEach(([c,a,b]) => { const e = el.querySelector(c); e.setAttribute('cx',cx); e.setAttribute('cy',cy); e.setAttribute('rx',a); e.setAttribute('ry',b); });
    const put = (arr, rx, ry, speed, off) => arr.forEach((b,i) => {
      const th = off + phase*speed + i*(Math.PI*2/arr.length);
      const x = cx + rx*Math.cos(th), y = cy + ry*Math.sin(th), d = (Math.sin(th)+1)/2;
      const sc = (.72 + .42*d) * (+b.dataset.k || 1);
      b.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%) scale(${sc.toFixed(3)})`;
      b.style.opacity = (.5 + .5*d).toFixed(3);
      b.style.zIndex = d > .5 ? 3 : 1;
      b.style.filter = d < .3 ? `blur(${((.3-d)*3).toFixed(2)}px)` : '';
    });
    put(songsS, R, r, 1, 0);
    put(learnS, R2, r2, -1.25, 1.1);
    put(knownS, R3, r3, 1.6, .4);
  };
  const tick = now => {
    const dt = Math.min(64, now - t0); t0 = now;
    if (!paused && !reduce) phase += dt * 0.00016;
    window.__fluidPhase = phase;
    place(); orbitRAF = requestAnimationFrame(tick);
  };
  place(); if (!reduce) orbitRAF = requestAnimationFrame(tick);
  window.onresize = place;
}

      const nxtIsLyric = nxt.trim() && !isChordLine(nxt) && !isSec(nxt) && !TAB_LINE.test(nxt) && !JUNK.test(nxt.trim()) && !/^\[/.test(nxt.trim());
      if (nxtIsLyric){
