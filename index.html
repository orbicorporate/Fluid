.ph-rows span{color:var(--muted)}
/* @@EXTRAS-CSS@@ */
/* ===== extras: celebração ===== */
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:200}
.cele{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:201;display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px;border-radius:22px;
  background:var(--sheetBg,var(--surface));border:1px solid var(--glassEdge);box-shadow:var(--glassHi),0 20px 50px -14px rgba(60,40,140,.45);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);animation:celeIn .55s cubic-bezier(.2,1.3,.3,1) both;max-width:calc(100% - 32px)}
.cele.out{animation:celeOut .5s ease both}
@keyframes celeIn{from{opacity:0;transform:translate(-50%,-24px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes celeOut{to{opacity:0;transform:translate(-50%,-16px) scale(.96)}}
.cele-ic{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;background:conic-gradient(from 200deg,#34E0BE,#8B5CF6,#F43F7E,#FACC15,#34E0BE);animation:celeSpin 2.4s linear infinite;box-shadow:0 8px 20px -6px rgba(139,92,246,.6)}
.cele-ic svg{width:24px;height:24px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
@keyframes celeSpin{to{filter:hue-rotate(360deg)}}
.cele small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accentInk)}
.cele b{display:block;font-family:var(--fDisplay);font-size:16px}
.cele em{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}

/* ===== seu treino (sequência, meta, semana, conquistas) ===== */
.pract{position:relative;margin-block:14px 6px;padding:16px;border-radius:26px;display:grid;grid-template-columns:auto auto 1fr;gap:14px 16px;align-items:center;overflow:hidden;
  background:linear-gradient(140deg,color-mix(in srgb,#F97316 10%,var(--glass)),color-mix(in srgb,#8B5CF6 9%,var(--glass)) 55%,color-mix(in srgb,#14B8A6 9%,var(--glass)));
  border:1px solid var(--glassEdgeSoft);border-top-color:var(--glassEdge);box-shadow:var(--glassHi),var(--glassDrop);-webkit-backdrop-filter:var(--blurG);backdrop-filter:var(--blurG);animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}
.pr-streak{display:flex;align-items:center;gap:8px}
.pr-streak .flame{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--faint);background:var(--glass2);border:1px solid var(--line)}
.pr-streak .flame svg{width:24px;height:24px}
.pr-streak.lit .flame{color:#fff;background:linear-gradient(170deg,#FDBA74,#F97316 55%,#EA580C);border-color:transparent;box-shadow:0 10px 22px -8px rgba(249,115,22,.7)}
.pr-streak.lit .flame svg{animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}30%{transform:scale(1.08,1.12) rotate(2deg)}60%{transform:scale(.96,1.04) rotate(-1deg)}}
.pr-streak b{display:block;font-family:var(--fDisplay);font-size:24px;line-height:1}
.pr-streak small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.pr-ring{position:relative;width:76px;height:76px;border:0!important;background:none!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;padding:0;color:var(--text)}
.pr-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg-track{fill:none;stroke:var(--line);stroke-width:7}
.rg-prog{fill:none;stroke:url(#none);stroke:#22C55E;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.pr-ring span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.pr-ring b{font-family:var(--fDisplay);font-size:18px}.pr-ring small{font-size:9.5px;color:var(--muted)}
.pr-week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;height:76px;align-items:end;min-width:0}
.pr-week span{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.pr-week i{display:block;width:100%;max-width:16px;border-radius:6px 6px 4px 4px;background:var(--line);transition:height .6s cubic-bezier(.2,.8,.2,1)}
.pr-week span.on i{background:linear-gradient(180deg,#A78BFA,#6366F1)}
.pr-week span.today i{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.pr-week small{font-size:10px;font-weight:600;color:var(--faint)}
.pr-week span.today small{color:var(--accentInk)}
.pr-ach{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px solid var(--line);min-width:0}
.pr-ach-h small{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.pr-ach-h b{font-family:var(--fDisplay);font-size:15px}
.pr-badges{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:4px 2px;flex:1;min-width:0}
.pr-badges::-webkit-scrollbar{display:none}
.badge-a{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;width:36px;height:36px;flex-shrink:0;border-radius:12px;border:1px dashed var(--lineStrong);background:transparent;color:var(--faint);display:flex;align-items:center;justify-content:center;padding:0;transition:transform .2s cubic-bezier(.2,1.3,.3,1)}
.badge-a svg{width:18px;height:18px;opacity:.55}
.badge-a.got{border:0;color:#fff;background:radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--c) 45%,#fff),var(--c) 60%,color-mix(in srgb,var(--c) 70%,#000));box-shadow:inset 0 -2px 5px rgba(0,0,0,.2),inset 0 2px 3px rgba(255,255,255,.4),0 6px 14px -6px var(--c)}
.badge-a.got svg{opacity:1}
.badge-a:hover{transform:translateY(-2px) scale(1.08)}
@media (max-width:520px){.pract{grid-template-columns:auto 1fr;gap:12px}.pr-week{grid-column:1/-1;height:64px}}

/* ===== afinador ===== */
.tuner-card .tc-row{display:flex;align-items:center;gap:14px}
.tuner-card .tc-row>div{flex:1;min-width:0}
.tc-ic{width:46px;height:46px;border-radius:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(160deg,#5EEAD4,#10B981);box-shadow:0 8px 18px -8px rgba(16,185,129,.7)}
.tc-ic svg{width:24px;height:24px}
.tuner-card .btn svg{width:18px;height:18px}
.tuner-card details{margin-top:12px}
.tu-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:12px 18px calc(30px + env(safe-area-inset-bottom,0px));position:relative;z-index:1;overflow-y:auto}
.tu-gauge{position:relative;width:min(340px,86vw);display:flex;flex-direction:column;align-items:center;gap:6px;--tc:var(--faint)}
.tu-gauge.near{--tc:#F59E0B}.tu-gauge.ok{--tc:#22C55E}
.tu-arc{position:relative;width:100%;aspect-ratio:2/1.15;overflow:hidden}
.tu-tick{position:absolute;left:50%;bottom:6%;width:2px;height:88%;margin-left:-1px;transform-origin:50% 100%}
.tu-tick::before{content:"";position:absolute;top:0;left:0;width:2px;height:8%;border-radius:2px;background:var(--lineStrong)}
.tu-tick.big::before{height:13%;background:var(--muted)}
.tu-tick.mid::before{height:17%;width:4px;left:-1px;background:#22C55E}
.tu-needle{position:absolute;left:50%;bottom:6%;width:4px;height:80%;margin-left:-2px;transform-origin:50% 100%;transition:transform .12s linear}
.tu-needle i{position:absolute;inset:0;border-radius:4px;background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 40%,transparent));box-shadow:0 0 18px var(--tc)}
.tu-hub{position:absolute;left:50%;bottom:calc(6% - 11px);width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--solid);border:4px solid var(--tc);box-shadow:0 0 0 6px color-mix(in srgb,var(--tc) 18%,transparent);transition:border-color .2s}
.tu-read{display:flex;flex-direction:column;align-items:center}
.tu-note{font-family:var(--fDisplay);font-size:84px;font-weight:600;line-height:1;color:var(--text);transition:color .2s,transform .2s}
.tu-gauge.ok .tu-note{color:#16A34A;transform:scale(1.06);text-shadow:0 0 30px rgba(34,197,94,.45)}
.tu-hz{font-family:var(--fMono);font-size:13px;color:var(--muted);min-height:18px}
.tu-msg{margin:4px 0 0;font-size:16px;font-weight:600;color:var(--tc);min-height:22px;text-align:center}
.tu-gauge.ok::after{content:"";position:absolute;left:50%;top:40%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,.22),transparent 65%);animation:tuGlow 1.2s ease-out infinite;pointer-events:none}
@keyframes tuGlow{from{transform:scale(.7);opacity:1}to{transform:scale(1.3);opacity:0}}
.tu-strings{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:min(420px,100%)}
.tu-str{position:relative;height:64px;border-radius:18px;border:1px solid var(--glassEdgeSoft);background:var(--glass);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--text);transition:transform .2s cubic-bezier(.2,1.3,.3,1),border-color .2s,background .2s}
.tu-str b{font-family:var(--fDisplay);font-size:20px}.tu-str small{font-size:11px;color:var(--muted)}
.tu-str i{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#22C55E;color:#fff;display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.6,.3,1)}
.tu-str i svg{width:12px;height:12px}
.tu-str.cur{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 10px 24px -10px var(--glow)}
.tu-str.done{background:color-mix(in srgb,#22C55E 12%,var(--glass));border-color:color-mix(in srgb,#22C55E 40%,transparent)}
.tu-str.done i{transform:scale(1)}

/* ===== treino: contar pelo microfone ===== */
.tr-ear{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tr-ear .btn svg{width:17px;height:17px}
.tr-ear-m{display:block;width:100%;max-width:240px;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.tr-ear-m i{display:block;height:100%;width:0;border-radius:999px;background:var(--faint);transition:width .1s linear,background .2s}
.tr-ear[data-state="good"] .tr-ear-m i{background:#22C55E}
.tr-ear[data-state="same"] .tr-ear-m i{background:#F59E0B}
.tr-ear small{font-size:12px;color:var(--muted);max-width:280px}

/* ===== gravações ===== */
.rec-top{display:flex;align-items:center;gap:14px}
.rec-btn{width:58px;height:58px;border-radius:50%;flex-shrink:0;border:1px solid var(--glassEdgeSoft);background:var(--glass);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:var(--glassHi),0 8px 20px -10px rgba(225,29,72,.5);transition:transform .2s}
.rec-btn:hover{transform:scale(1.05)}
.rec-dot{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FB7185,#E11D48);box-shadow:0 0 0 4px rgba(225,29,72,.15);transition:border-radius .25s,width .25s,height .25s}
.rec-btn.on .rec-dot{width:18px;height:18px;border-radius:5px;animation:recPulse 1.2s ease-in-out infinite}
@keyframes recPulse{50%{box-shadow:0 0 0 10px rgba(225,29,72,0)}}
.rec-info{flex:1;min-width:0}.rec-info b{display:block;font-size:14.5px}.rec-info small{display:block;font-size:12.5px;color:var(--muted)}
.rec-time{font-family:var(--fMono);font-size:22px!important;color:#E11D48}
.rec-lvl{display:block;height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px;max-width:220px}
.rec-lvl i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FB7185,#E11D48);transition:width .1s linear}
.rec-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rec-list:empty{display:none}
.rec-cmp{justify-content:flex-start;gap:8px;height:auto;padding:10px 16px;flex-wrap:wrap}
.rec-cmp small{font-size:11.5px;color:var(--muted);font-weight:500}
.rec-item{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 8px;border-radius:16px;background:var(--glass2);border:1px solid var(--line)}
.rec-item.playing{border-color:color-mix(in srgb,#E11D48 40%,transparent);background:color-mix(in srgb,#E11D48 7%,var(--glass2))}
.rec-play{width:38px;height:38px;border-radius:50%;flex-shrink:0;border:0;padding:0;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(160deg,#FB7185,#E11D48)}
.rec-play svg{width:16px;height:16px}
.rec-meta{min-width:0}.rec-meta b{display:block;font-size:13.5px;white-space:nowrap}.rec-meta small{font-size:12px;color:var(--muted)}
.rec-wave{flex:1;display:flex;align-items:center;gap:2px;height:28px;min-width:40px;overflow:hidden}
.rec-wave i{flex:1;max-width:4px;min-height:20%;border-radius:2px;background:color-mix(in srgb,#E11D48 45%,var(--line))}
.rec-item.playing .rec-wave i{animation:wv 1s ease-in-out infinite}
.rec-item.playing .rec-wave i:nth-child(odd){animation-delay:-.5s}
@keyframes wv{50%{opacity:.4}}
.rec-x{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--faint);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.rec-x svg{width:14px;height:14px}.rec-x.armed{color:#fff;background:#E11D48}

/* ===== tocar junto (vídeo flutuante) ===== */
.along{position:fixed;z-index:40;right:16px;top:calc(70px + env(safe-area-inset-top,0px));width:min(340px,calc(100vw - 32px));border-radius:22px;overflow:hidden;background:var(--sheetBg,var(--surface));border:1px solid var(--glassEdge);box-shadow:var(--glassHi),0 24px 60px -18px rgba(20,22,60,.45);-webkit-backdrop-filter:blur(30px) saturate(1.7);backdrop-filter:blur(30px) saturate(1.7);animation:alIn .4s cubic-bezier(.2,1.2,.3,1) both}
@keyframes alIn{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}
.along>p{margin:0 14px 10px;font-size:13px;color:var(--muted)}
.al-head{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 6px 14px}.al-head b{font-size:14px}
.al-row{display:flex;gap:8px;margin:0 14px 8px}.al-row .inp{flex:1;min-width:0;height:42px;border-radius:12px;padding:0 12px;font-size:13px}
.al-find{display:block;margin:0 14px 14px;font-size:12.5px;font-weight:600;color:var(--accentInk)}
.al-video{position:relative;aspect-ratio:16/9;background:#000}
.al-video iframe,#al-frame{position:absolute;inset:0;width:100%;height:100%;border:0}
.al-err{color:#fff;font-size:13px;padding:16px;margin:0}.al-err a{color:#A5B4FC}
.al-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 10px}
.al-x{width:34px;height:34px;border-radius:50%;border:0;background:var(--glass2);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.al-x svg{width:15px;height:15px}
@media (max-width:620px){.along{top:calc(62px + env(safe-area-inset-top,0px));right:12px;width:min(250px,64vw);border-radius:18px}.al-bar .seg button{padding:0 8px;font-size:12px}}

/* ===== lição: prazo e comentário ===== */
.due-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.due-row label{font-size:13px;font-weight:600;color:var(--muted)}
.due-row .inp{height:40px;max-width:180px}
.due-row .hint{font-size:12px}
.hw-item{display:flex;flex-direction:column;gap:6px}
.hw-item .check-row{align-items:flex-start}
.due{font-weight:700;color:var(--accentInk)}.due.late{color:#DC2626}
.hw-rep-b{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.hw-rep-b svg{width:15px;height:15px}
.hw-reply{margin:0 0 0 36px;padding:8px 12px;border-radius:12px;background:var(--glowSoft);font-size:13px;color:var(--text)}
.hw-rep-f{display:flex;gap:8px;margin-left:36px}.hw-rep-f .inp{flex:1;min-width:0;height:40px;border-radius:12px;padding:0 12px}

/* ===== dedilhado clicável ===== */
.rb{margin-top:10px;padding:12px;border-radius:20px;background:var(--glass2);border:1px solid var(--glassEdgeSoft);display:flex;flex-direction:column;gap:10px}
.rb-hint{font-size:12.5px;color:var(--muted)}
.rb-scroll{overflow-x:auto;scrollbar-width:thin;margin:0 -4px;padding:0 4px 4px}
.rb-board{display:flex;flex-direction:column;gap:3px;min-width:calc(var(--frets) * 40px + 34px)}
.rb-row{position:relative;display:grid;grid-template-columns:30px repeat(var(--frets),1fr);gap:3px;align-items:center}
.rb-nums small{text-align:center;font-size:10.5px;font-weight:600;color:var(--faint)}
.rb-sn{font-size:11px;font-weight:700;color:var(--muted);text-align:right;padding-right:4px}
.rb-str{position:absolute;left:34px;right:0;top:50%;height:var(--w);margin-top:calc(var(--w) / -2);background:linear-gradient(90deg,rgba(160,140,110,.7),rgba(200,180,150,.7));pointer-events:none;z-index:0;border-radius:2px}
.rb-c{position:relative;z-index:1;height:34px;border-radius:10px;border:1px solid transparent;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s cubic-bezier(.2,1.4,.3,1)}
.rb-c i{font-style:normal;font-family:var(--fMono);font-size:11px;font-weight:600;color:transparent;width:28px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.rb-c:hover i{color:var(--accentInk);background:color-mix(in srgb,var(--accent) 14%,var(--solid));box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.rb-c.open{border-right:3px solid color-mix(in srgb,var(--text) 55%,transparent);border-radius:10px 2px 2px 10px}
.rb-row:not(.rb-nums) .rb-c:not(.open){border-right:1px solid var(--lineStrong);border-radius:0}
.rb-row:nth-child(4) .rb-c.dot::after{content:"";position:absolute;bottom:-6px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--lineStrong)}
.rb-c.used i{color:var(--accentInk);background:color-mix(in srgb,var(--accent) 16%,var(--solid));box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.rb-c.hit i,.rb-c.play i{color:var(--onAccent);background:var(--accent);box-shadow:0 0 0 4px var(--glowSoft);animation:rbPop .35s cubic-bezier(.2,1.6,.3,1)}
@keyframes rbPop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.rb-tools{display:flex;gap:6px;flex-wrap:wrap}
.rb-tools .btn svg{width:14px;height:14px}

/* ================= UX ================= */
#app,.sheet-body,.hb-body,.ux-sheet,.srch{zoom:var(--uiZoom,1)}
.top-ic{flex-shrink:0}
.top .brand{margin-right:auto}
.tabs{display:none}
.tab-title{font-family:var(--fDisplay);font-weight:600;font-size:26px;letter-spacing:-.02em;margin:14px 2px 2px;animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}

/* ---------- barra de baixo ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:16;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock-in{pointer-events:auto;display:flex;align-items:center;gap:2px;padding:6px;border-radius:30px;background:var(--sheetBg);border:1px solid var(--glassEdgeSoft);border-top-color:var(--glassEdge);box-shadow:var(--glassHi),0 18px 50px -12px rgba(20,22,60,.35);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);animation:dockIn .6s cubic-bezier(.2,.9,.25,1.2) backwards}
.dock-b{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:64px;height:54px;border:0;border-radius:22px;background:transparent;color:var(--faint);font-size:10.5px;font-weight:600;letter-spacing:.01em;transition:color .25s,background .25s,transform .2s cubic-bezier(.2,.8,.2,1)}
.dock-b small{font-size:10.5px;line-height:1;white-space:nowrap}
.dock-ic{position:relative;display:flex}
.dock-ic svg{width:23px;height:23px;transition:transform .35s cubic-bezier(.2,.9,.3,1.4)}
.dock-b:active{transform:scale(.92)}
.dock-b.on{color:var(--accentInk)}
.dock-b.on .dock-ic svg{transform:translateY(-1px) scale(1.08)}
.dock-b.on::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pop .35s cubic-bezier(.2,.8,.2,1) both}
.dock-b.on small{opacity:0}
.dock-badge{position:absolute;top:-5px;right:-9px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#EF4444;color:#fff;font-size:10px;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)}
.dock-badge.warn{background:#F59E0B}
.dock-badge[hidden]{display:none}
.dock-plus{width:58px;height:58px;margin:-18px 6px 0;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;color:#fff;background:conic-gradient(from 210deg,#34E0BE,#8B5CF6,#F43F7E,#FB923C,#34E0BE);box-shadow:0 0 0 4px var(--bg),0 14px 30px -6px rgba(139,92,246,.6);transition:transform .35s cubic-bezier(.2,.9,.3,1.4);position:relative}
.dock-plus::before{content:"";position:absolute;inset:3px;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),radial-gradient(circle at 50% 120%,rgba(0,0,0,.25),transparent 60%)}
.dock-plus svg{width:26px;height:26px;position:relative;transition:transform .35s cubic-bezier(.2,.9,.3,1.4);filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.dock-plus:active{transform:scale(.9)}
body.fab-on .dock-plus svg{transform:rotate(135deg)}
body.fab-on .dock{z-index:46}
@media (max-width:380px){.dock-b{width:54px}.dock-plus{width:52px;height:52px;margin-inline:3px}}
@keyframes dockIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
.sr-on .dock{display:none}

/* ---------- menu do + ---------- */
.ux-layer{position:fixed;inset:0;z-index:45}
.ux-scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:blur(10px) saturate(1.3);backdrop-filter:blur(10px) saturate(1.3);animation:fadeIn .25s ease both}
.ux-layer.out .ux-scrim{animation:fadeOut .22s ease both}
.fab-menu{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:stretch;gap:10px;width:min(330px,calc(100% - 40px))}
.fab-it{display:flex;align-items:center;justify-content:flex-end;gap:12px;border:0;background:none;padding:0;color:var(--text);animation:fabIn .42s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:var(--d)}
.fab-lb{padding:10px 16px;border-radius:999px;font-weight:600;font-size:14.5px;background:var(--sheetBg);border:1px solid var(--glassEdge);box-shadow:var(--glassHi),0 10px 30px -10px rgba(20,22,60,.3);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);flex:1;text-align:left}
.fab-ic{width:48px;height:48px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px -8px var(--c);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.fab-ic svg{width:23px;height:23px}
.fab-it:hover .fab-ic,.fab-it:focus-visible .fab-ic{transform:scale(1.08) rotate(-4deg)}
.fab-it:active .fab-ic{transform:scale(.92)}
.ux-layer.out .fab-it{animation:fabOut .18s ease both}
@keyframes fabIn{from{opacity:0;transform:translateY(40px) scale(.6)}to{opacity:1;transform:none}}
@keyframes fabOut{to{opacity:0;transform:translateY(20px) scale(.9)}}
@keyframes fadeOut{to{opacity:0}}

/* ---------- folha de baixo genérica ---------- */
.ux-sheet{position:absolute;left:50%;bottom:0;width:min(520px,100%);max-height:88dvh;overflow-y:auto;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;background:var(--sheetBg);border:1px solid var(--glassEdge);border-bottom:0;box-shadow:var(--glassHi),0 -20px 60px -20px rgba(20,22,60,.35);-webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8);animation:sheetUp .45s cubic-bezier(.2,.85,.2,1) both}
.ux-sheet{translate:-50% 0}
.ux-layer.out .ux-sheet{animation:sheetDown .24s ease-in both}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{to{transform:translateY(100%)}}
.ux-grab-zone{display:flex;justify-content:center;padding:10px 0 6px;touch-action:none;cursor:grab}
.ux-grab{width:42px;height:5px;border-radius:9px;background:var(--lineStrong)}
.ux-sh-head{display:flex;align-items:center;gap:12px;padding:6px 4px 14px;touch-action:none}
.ux-sh-head span:last-child{display:flex;flex-direction:column;min-width:0}
.ux-sh-head b{font-family:var(--fDisplay);font-size:17px;font-weight:600}
.ux-sh-head small{color:var(--muted);font-size:13px}
.ux-sh-title{font-family:var(--fDisplay);font-size:19px;font-weight:600;margin:4px 4px 14px;touch-action:none}
.ux-acts{display:flex;flex-direction:column;gap:6px}
.ux-act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 12px;border-radius:18px;border:1px solid transparent;background:transparent;color:var(--text);animation:cardIn .4s cubic-bezier(.2,.8,.2,1) both;transition:background .15s}
.ux-act:hover,.ux-act:focus-visible{background:var(--glass);border-color:var(--glassEdgeSoft)}
.ux-act span:last-child{display:flex;flex-direction:column;min-width:0}
.ux-act b{font-weight:600;font-size:15px}
.ux-act small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ux-act-ic{width:42px;height:42px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--glowSoft);color:var(--accentInk)}
.ux-act-ic svg{width:21px;height:21px}
.ux-act.danger{color:var(--bad)}.ux-act.danger .ux-act-ic{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.ux-look{display:flex;flex-direction:column;gap:14px;padding:0 4px 6px}
.ux-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ux-lbl{font-weight:600}
.ux-prev{margin:-6px 0 2px;color:var(--muted);font-size:13px}
.ux-tog{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:18px;border:1px solid var(--glassEdgeSoft);background:var(--glass);color:var(--text)}
.ux-tog span{display:flex;flex-direction:column}.ux-tog b{font-weight:600;font-size:15px}.ux-tog small{color:var(--muted);font-size:12.5px}
.ux-tog i{width:46px;height:28px;border-radius:999px;background:var(--lineStrong);position:relative;flex-shrink:0;transition:background .25s}
.ux-tog i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.2,.9,.3,1.3)}
.ux-tog[aria-checked="true"] i{background:#22C55E}
.ux-tog[aria-checked="true"] i::after{transform:translateX(18px)}
.ux-qform{display:flex;gap:8px;padding:0 4px}
.ux-qform .inp{flex:1;height:48px}
.ux-qform .btn{height:48px}
.ux-sheet .ux-prev{padding:0 4px;margin-top:10px}

/* ---------- busca ---------- */
.srch{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));width:min(620px,calc(100% - 24px));max-height:calc(100dvh - 40px);translate:-50% 0;display:flex;flex-direction:column;border-radius:26px;background:var(--sheetBg);border:1px solid var(--glassEdge);box-shadow:var(--glassHi),0 30px 80px -20px rgba(20,22,60,.4);-webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8);overflow:hidden;animation:srIn .32s cubic-bezier(.2,.85,.2,1) both}
.ux-layer.out .srch{animation:srOut .18s ease both}
@keyframes srIn{from{opacity:0;transform:translateY(-14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes srOut{to{opacity:0;transform:translateY(-8px) scale(.98)}}
.srch-bar{display:flex;align-items:center;gap:10px;padding:0 10px 0 18px;height:62px;border-bottom:1px solid var(--line);color:var(--muted)}
.srch-bar svg{width:20px;height:20px;flex-shrink:0}
.srch-bar input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;color:var(--text);outline:none;height:100%}
.srch-bar input::-webkit-search-cancel-button{display:none}
.srch-x{height:30px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--muted);font-size:12px;font-weight:600}
.srch-list{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
.sr-h{margin:10px 10px 4px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sr-it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 10px;border-radius:16px;border:1px solid transparent;background:transparent;color:var(--text);animation:cardIn .3s cubic-bezier(.2,.8,.2,1) both}
.sr-it>svg{width:16px;height:16px;color:var(--faint);flex-shrink:0;opacity:0;transition:opacity .15s,transform .15s}
.sr-it.sel,.sr-it:hover{background:var(--glass);border-color:var(--glassEdgeSoft)}
.sr-it.sel>svg,.sr-it:hover>svg{opacity:1;transform:translateX(2px)}
.sr-tx{display:flex;flex-direction:column;min-width:0;flex:1}
.sr-tx b{font-weight:600;font-size:15px}
.sr-tx small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-ic{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c))}
.sr-ic svg{width:19px;height:19px}
.sr-dot{width:38px;height:38px;font-size:12px}
.sr-dia{width:38px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--glass);border:1px solid var(--glassEdgeSoft);overflow:hidden}
.sr-dia svg{width:36px;height:auto;color:var(--text)}
.sr-it kbd{font-family:var(--fMono);font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.sr-empty{text-align:center;padding:16px 18px 22px;color:var(--muted)}
.sr-empty p{max-width:40ch;margin:0 auto}
@media (max-width:640px){.srch{top:0;width:100%;max-height:100dvh;height:100dvh;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px)}}

/* ---------- Hoje ---------- */
.hj-greet{margin:18px 2px 12px;animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both}
.hj-greet h1{font-family:var(--fDisplay);font-weight:600;font-size:clamp(26px,6.4vw,34px);letter-spacing:-.025em;line-height:1.1;margin:0;background:linear-gradient(100deg,var(--text) 30%,var(--accentInk) 70%,var(--text));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmerTx 7s ease-in-out infinite}
.hj-greet p{margin:4px 0 0;color:var(--muted);text-transform:capitalize;font-size:14px}
@keyframes shimmerTx{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.hj-search{display:flex;align-items:center;gap:10px;width:100%;height:50px;padding:0 10px 0 16px;border-radius:999px;margin-bottom:14px;color:var(--muted);background-color:var(--glass);border:1px solid var(--glassEdgeSoft);border-top-color:var(--glassEdge);box-shadow:var(--glassHi),var(--glassDrop);-webkit-backdrop-filter:var(--blurG);backdrop-filter:var(--blurG);font-size:14.5px;text-align:left;animation:cardIn .55s .05s cubic-bezier(.2,.8,.2,1) both;transition:transform .2s}
.hj-search:active{transform:scale(.985)}
.hj-search svg{width:19px;height:19px;flex-shrink:0}
.hj-search span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hj-search kbd{font-family:var(--fMono);font-size:11px;padding:3px 8px;border-radius:8px;border:1px solid var(--line);color:var(--faint)}
@media (hover:none){.hj-search kbd{display:none}}
.hj-card{position:relative;display:block;width:100%;text-align:left;color:var(--text);padding:18px;border-radius:26px;margin-block:12px;background-color:var(--glass);background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 60%);border:1px solid var(--glassEdgeSoft);border-top-color:var(--glassEdge);box-shadow:var(--glassHi),var(--glassDrop);-webkit-backdrop-filter:var(--blurG);backdrop-filter:var(--blurG);animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 60ms + 80ms)}
.hj-pract,.hj-metro{animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 60ms + 80ms)}
.hj-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hj-h h3,.hj-h h4{display:flex;align-items:center;gap:8px;margin:0;font-size:15.5px;font-weight:600;margin-right:auto}
.hj-h h4{font-size:14px}
.hj-h svg{width:19px;height:19px;color:var(--accentInk)}
.hj-h.sub{margin:16px 0 8px}
.hj-h .linkish,.hj-more{font-size:13px}
.hj-pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--glowSoft);color:var(--accentInk)}
.hj-pill.bad{background:color-mix(in srgb,#EF4444 14%,transparent);color:var(--bad)}
.hj-kicker{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accentInk)}
.hj-muted{color:var(--muted);font-size:14px;margin:0}
.hj-ok{display:flex;align-items:center;gap:8px;margin:14px 0 0;color:var(--ok);font-weight:600;font-size:14px}
.hj-ok svg{width:18px;height:18px}

.hj-hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;overflow:hidden;padding:20px}
.hj-hero::before{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);opacity:.9;pointer-events:none;animation:breath 6s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.15) translate(-10px,10px)}}
.hj-ring{position:relative;width:92px;height:92px}
.hj-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hj-ring .rg-track{stroke-width:6}
.hj-ring .rg-prog{stroke-width:6;stroke:url(#none);stroke:var(--accent);filter:drop-shadow(0 0 6px var(--glow));animation:ringIn 1.2s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringIn{from{stroke-dashoffset:157}}
.hj-ring span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.hj-ring b{font-family:var(--fDisplay);font-size:24px;font-weight:600}
.hj-ring small{font-size:10.5px;color:var(--muted)}
.hj-hero-tx{position:relative;min-width:0}
.hj-hero h3{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-family:var(--fDisplay);font-size:21px;font-weight:600;margin:6px 0 4px;letter-spacing:-.01em}
.hj-hero h3 i{font-style:normal;color:var(--faint)}
.hj-ch{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:38px;padding:0 12px;border-radius:14px;background:var(--glowSoft);color:var(--accentInk);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);animation:chIn .6s cubic-bezier(.2,.9,.3,1.3) both}
.hj-ch+i+.hj-ch{animation-delay:.12s}
.hj-ch.mono{font-family:var(--fMono);font-size:15px}
@keyframes chIn{from{opacity:0;transform:scale(.6) translateY(6px)}to{opacity:1;transform:none}}
.hj-hero p{margin:0 0 14px;color:var(--muted);font-size:14px;max-width:46ch}
.hj-go{height:46px}
.hj-go svg{width:16px;height:16px}
@media (max-width:440px){.hj-hero{grid-template-columns:1fr;justify-items:start}.hj-ring{position:absolute;right:16px;top:16px;width:72px;height:72px}.hj-ring b{font-size:19px}.hj-hero-tx{padding-right:0}.hj-hero h3{padding-right:80px}}

.hj-cont{display:flex;align-items:center;gap:14px;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.hj-cont::before{content:"";position:absolute;left:-40px;top:-40px;width:180px;height:160px;border-radius:50%;background:var(--sc);opacity:.18;filter:blur(40px);pointer-events:none}
.hj-cont:active{transform:scale(.985)}
.dotc.big{width:54px;height:54px;font-size:16px;box-shadow:0 10px 24px -8px rgba(20,22,60,.35);position:relative}
.hj-ln{display:flex;flex-direction:column;min-width:0;flex:1}
.hj-ln b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hj-ln small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hj-ln .hj-kicker{font-size:10.5px;color:var(--accentInk)}
.hj-play{width:48px;height:48px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--onAccent);box-shadow:0 10px 24px -6px var(--glow);position:relative}
.hj-play::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ping 2.4s cubic-bezier(.2,.8,.2,1) infinite}
.hj-play svg{width:19px;height:19px;margin-left:2px}
@keyframes ping{0%{opacity:.6;transform:scale(.9)}80%,100%{opacity:0;transform:scale(1.35)}}

.hj-lessons{display:flex;flex-direction:column;gap:6px}
.hj-lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 10px 8px 8px;border-radius:18px;border:1px solid var(--glassEdgeSoft);background:var(--glass2);color:var(--text);transition:transform .2s}
.hj-lesson:active{transform:scale(.985)}
.hj-lesson>svg{width:16px;height:16px;color:var(--faint);flex-shrink:0}
.hj-time{font-family:var(--fMono);font-size:13px;min-width:46px;text-align:center;padding:6px 0;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--text))}
.hj-lesson .dotc{width:34px;height:34px;font-size:11px}
.hj-lesson.ok .hj-ln small{color:var(--ok)}.hj-lesson.falta .hj-ln small{color:var(--bad)}
.hj-pays{display:flex;flex-direction:column;gap:6px}
.hj-pay{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 12px 8px 8px;border-radius:18px;border:1px solid color-mix(in srgb,#EF4444 22%,var(--glassEdgeSoft));background:color-mix(in srgb,#EF4444 5%,var(--bg));color:var(--text)}
.hj-pay .dotc{width:34px;height:34px;font-size:11px}
.hj-amt{font-family:var(--fDisplay);font-size:14.5px;color:var(--bad);white-space:nowrap}
.hj-lead{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;text-align:left;padding:12px 14px;border-radius:18px;border:1px solid color-mix(in srgb,#8B5CF6 30%,transparent);background:linear-gradient(120deg,color-mix(in srgb,#8B5CF6 14%,transparent),color-mix(in srgb,#F43F7E 10%,transparent));color:var(--text)}
.hj-lead>svg:first-child{width:22px;height:22px;color:#8B5CF6;animation:spin 6s linear infinite}
.hj-lead span{display:flex;flex-direction:column;flex:1}.hj-lead small{color:var(--muted);font-size:12.5px}
.hj-lead>svg:last-child{width:16px;height:16px;color:var(--faint)}
.hj-empty{text-align:center;padding:22px 20px}
.hj-empty h3{font-family:var(--fDisplay);font-size:20px;margin:4px 0 6px}
.hj-empty p{color:var(--muted);max-width:42ch;margin:0 auto 16px}
.hj-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hj-btns svg{width:18px;height:18px}
.hj-ask{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:12px 14px;border-radius:18px;border:1px dashed var(--lineStrong);background:transparent;color:var(--muted);text-align:left;font-size:14px;transition:background .2s,color .2s}
.hj-ask:hover{background:var(--glass2);color:var(--text)}
.hj-ask span{flex:1}
.hj-ask svg{width:19px;height:19px;flex-shrink:0}
.hj-ask svg:first-child{color:#0EA5E9}
.hj-more{display:block;margin:8px auto 0}
.hj-metro .metro{margin-top:12px}

/* ---------- deslizar ---------- */
.sw{position:relative;border-radius:16px;touch-action:pan-y}
.sw-fg{position:relative;z-index:1;touch-action:pan-y;will-change:transform;user-select:none;-webkit-user-select:none}
.sw-fg input,.sw-fg textarea{user-select:text;-webkit-user-select:text}
.sw-bg{position:absolute;inset:0;border-radius:inherit;display:flex;align-items:center;justify-content:space-between;padding:0 18px;opacity:0;font-weight:700;font-size:14px;color:#fff;overflow:hidden;pointer-events:none}
.sw.swiping .sw-bg{opacity:1}
.sw[data-dir="r"] .sw-bg{background:linear-gradient(90deg,#22C55E,color-mix(in srgb,#22C55E calc(var(--swp,0) * 100%),transparent))}
.sw[data-dir="l"] .sw-bg{background:linear-gradient(270deg,#25D366,color-mix(in srgb,#128C7E calc(var(--swp,0) * 100%),transparent))}
.sw-bg span{display:flex;align-items:center;gap:6px;opacity:calc(.35 + var(--swp,0) * .65);transform:scale(calc(.8 + var(--swp,0) * .25));transition:transform .2s cubic-bezier(.2,.9,.3,1.4)}
.sw-bg svg{width:20px;height:20px}
.sw[data-dir="r"] .sw-bg .l,.sw[data-dir="l"] .sw-bg .r{visibility:hidden}
.sw-bg .l{margin-left:auto}
.sw.armed .sw-bg span{transform:scale(1.12)}
.sw.swiping>.sw-fg{background-color:var(--bg);border-radius:inherit;box-shadow:0 8px 24px -10px rgba(20,22,60,.35)}
.check-list .sw>.sw-fg.check-row,.check-list .sw>.sw-fg>.check-row{padding:4px 0}
.hj-hw .sw-fg{padding:6px 4px}
.sw-tip{margin:10px 2px 0;font-size:12px;color:var(--faint)}
.leaving{animation:leave .5s .25s cubic-bezier(.4,0,.2,1) both;pointer-events:none}
@keyframes leave{to{opacity:0;transform:translateX(30px);height:0;margin:0;padding:0}}
.check.checking{background:#22C55E!important;border-color:#22C55E!important;animation:checkPop .45s cubic-bezier(.2,.9,.3,1.5) both;position:relative}
.check.checking::before{content:"";width:13px;height:7px;border-left:2.6px solid #fff;border-bottom:2.6px solid #fff;transform:translateY(-2px) rotate(-45deg) scale(0);animation:checkDraw .3s .08s cubic-bezier(.2,.9,.3,1.4) both}
.check.checking::after{content:"";position:absolute;inset:-6px;border-radius:12px;border:2px solid #22C55E;animation:ring .5s ease-out both}
@keyframes checkPop{0%{transform:scale(.8)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes checkDraw{to{transform:translateY(-2px) rotate(-45deg) scale(1)}}
@keyframes ring{from{opacity:.9;transform:scale(.7)}to{opacity:0;transform:scale(1.5)}}
.all-done{text-align:center;color:var(--muted);font-size:14px}
.all-done .illo{height:80px;margin:0 auto 2px}
.all-done p{margin:0}

/* ---------- segurar card ---------- */
.card.holding,[data-open].holding{transition:transform .45s cubic-bezier(.2,.8,.2,1);transform:scale(.97)}
.card.pressed{transform:scale(1.02)!important;box-shadow:0 0 0 3px var(--accent),0 20px 40px -10px var(--glow)!important}
.card,.sat{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}

/* ---------- desfazer ---------- */
.toast.undo{display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px;overflow:hidden;min-width:min(340px,calc(100% - 32px))}
.toast.undo .ut-msg{flex:1}
.ut-btn{height:34px;padding:0 14px;border-radius:999px;border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:700;font-size:13.5px}
.ut-btn:hover{background:color-mix(in srgb,var(--bg) 28%,transparent)}
.ut-bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accent);transform-origin:left;animation:utBar linear both}
@keyframes utBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.toast.out{animation:toastOut .25s ease both}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,12px)}}

/* ---------- ilustrações ---------- */
.illo{display:block;width:180px;height:108px;margin:0 auto 8px;overflow:visible}
.il-fill{fill:var(--glowSoft);stroke:var(--accent);stroke-width:2}
.il-hole{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.il-neck{fill:var(--accent);opacity:.85}
.il-line{stroke:var(--accent);stroke-width:3;stroke-linecap:round;fill:none;opacity:.6}
.il-line-f{fill:var(--accent);opacity:.5}
.il-thick{stroke:var(--accent);stroke-width:9;stroke-linecap:round}
.il-check{fill:none;stroke:#22C55E;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;animation:draw .8s .3s cubic-bezier(.2,.8,.2,1) forwards}
.il-done .il-fill{fill:color-mix(in srgb,#22C55E 14%,transparent);stroke:#22C55E}
.il-notes path{fill:none;stroke-width:2.5;stroke-linecap:round}
.il-n1{stroke:#8B5CF6;fill:#8B5CF6}.il-n2{stroke:#F43F7E;fill:#F43F7E}
.il-notes path.il-n1,.il-notes path.il-n2{fill:none}

<script>
(() => {
/* ---------- music model ---------- */
const OPEN = {1:64,2:59,3:55,4:50,5:45,6:40};          // e B G D A E (MIDI)

const LIB = {
  'C':[[5,3],[4,2],[2,1]], 'Cmaj7':[[5,3],[4,2]], 'C7':[[5,3],[4,2],[3,3],[2,1]],
  'D':[[3,2],[1,2],[2,3]], 'Dm':[[3,2],[2,3],[1,1]], 'D7':[[3,2],[2,1],[1,2]], 'Dsus4':[[3,2],[2,3],[1,3]], 'Dsus2':[[3,2],[2,3]],
  'E':[[5,2],[4,2],[3,1]], 'Em':[[5,2],[4,2]], 'E7':[[5,2],[3,1]], 'Em7':[[5,2]],
  'F':[[4,3],[3,2],[2,1],[1,1]], 'Fmaj7':[[4,3],[3,2],[2,1]],
  'G':[[6,3],[5,2],[1,3]], 'G7':[[6,3],[5,2],[1,1]],
  'A':[[4,2],[3,2],[2,2]], 'Am':[[4,2],[3,2],[2,1]], 'A7':[[4,2],[2,2]], 'Am7':[[4,2],[2,1]], 'Asus2':[[4,2],[3,2]], 'Asus4':[[4,2],[3,2],[2,3]],
  'B7':[[5,2],[4,1],[3,2],[1,2]], 'Bm':[[5,2],[4,4],[3,4],[2,3],[1,2]]
};
const LIB_MUTE = {C:[6],Cmaj7:[6],C7:[6],D:[6,5],Dm:[6,5],D7:[6,5],Dsus4:[6,5],Dsus2:[6,5],F:[6,5],Fmaj7:[6,5],A:[6],Am:[6],A7:[6],Am7:[6],Asus2:[6],Asus4:[6],B7:[6],Bm:[6]};
const QUICK = ['C','D','Dm','E','Em','F','G','A','Am','Bm','B7','Cmaj7','Em7','Am7','D7','G7','A7','E7'];
const TEMPL = [['',[0,4,7]],['m',[0,3,7]],['7',[0,4,7,10]],['maj7',[0,4,7,11]],['m7',[0,3,7,10]],['sus2',[0,2,7]],['sus4',[0,5,7]],['dim',[0,3,6]],['add9',[0,2,4,7]],['6',[0,4,7,9]],['m6',[0,3,7,9]],['5',[0,7]]];
const HUES = ['#4F46E5','#DB2777','#0284C7','#C2410C','#047857','#7C3AED','#E11D48','#0F766E'];

const posKey = pos => pos.map(([s,f]) => s+':'+f).sort().join(',');
const LIBKEY = Object.fromEntries(Object.entries(LIB).map(([n,p]) => [posKey(p), n]));

function chordFromName(name){
  const n = normName(name); if (!LIB[n]) return null;
  return {pos: LIB[n].map(x => x.slice()), mute:(LIB_MUTE[n]||[]).slice(), open:[]};

function normName(n){ n = (n||'').trim(); const m = n.match(/^([A-Ga-g])([#b]?)(.*)$/); if(!m) return n; return m[1].toUpperCase()+m[2]+m[3]; }

  if (!ch || !ch.pos || !ch.pos.length) return (ch && ch.pos && !ch.pos.length && (ch.open||[]).length) ? analyze(ch) : '';
  if (ch.name) return ch.name;

function analyze(ch){
  const fr = {}; ch.pos.forEach(([s,f]) => fr[s]=f);
  const bass = ch.pos.length ? Math.max(...ch.pos.map(p=>p[0])) : 6;
  const notes = [];

    const cv = covers.find(c => c.size==='SMALL') || covers.find(c => c.size==='DEFAULT') || covers[0];
    const url = String(e.url||''); const isTrack = /open\.spotify\.com\/(?:intl-[a-z]+\/)?track\//.test(url);

/* ---------- orbit animation: three tilted rings with depth, pauses on hover ---------- */
let orbitRAF = 0;
function startOrbit(){
  cancelAnimationFrame(orbitRAF);
  const el = document.getElementById('orbit'); if (!el) return;
  const sats = [...el.querySelectorAll('.sat')];
  const by = k => sats.filter(s=>s.dataset.orb===k);
  const songsS = by('song'), learnS = by('learn'), knownS = by('known');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let paused = false; el.onmouseenter=()=>paused=true; el.onmouseleave=()=>paused=false;
  el.addEventListener('focusin',()=>paused=true); el.addEventListener('focusout',()=>paused=false);
  let t0 = performance.now(), phase = (window.__fluidPhase||0);
  const place = () => {
    const w = el.clientWidth, h = el.clientHeight, cx = w/2, cy = h/2 - 10;
    const R = Math.min(w*0.47, 340), r = R*0.36;
    const R2 = R*0.70, r2 = R2*0.36, R3 = R*0.42, r3 = R3*0.40;
    [['.r1',R,r],['.r2',R2,r2],['.r3',R3,r3]].forEach(([c,a,b]) => { const e = el.querySelector(c); e.setAttribute('cx',cx); e.setAttribute('cy',cy); e.setAttribute('rx',a); e.setAttribute('ry',b); });
    const put = (arr, rx, ry, speed, off) => arr.forEach((b,i) => {
      const th = off + phase*speed + i*(Math.PI*2/arr.length);
      const x = cx + rx*Math.cos(th), y = cy + ry*Math.sin(th), d = (Math.sin(th)+1)/2;
      const sc = (.72 + .42*d) * (+b.dataset.k || 1);
      b.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-50%) scale(${sc.toFixed(3)})`;
      b.style.opacity = (.5 + .5*d).toFixed(3);
      b.style.zIndex = d > .5 ? 3 : 1;
      b.style.filter = d < .3 ? `blur(${((.3-d)*3).toFixed(2)}px)` : '';
    });
    put(songsS, R, r, 1, 0);
    put(learnS, R2, r2, -1.25, 1.1);
    put(knownS, R3, r3, 1.6, .4);
  };
  const tick = now => {
    const dt = Math.min(64, now - t0); t0 = now;
    if (!paused && !reduce) phase += dt * 0.00016;
    window.__fluidPhase = phase;
    place(); orbitRAF = requestAnimationFrame(tick);
  };
  place(); if (!reduce) orbitRAF = requestAnimationFrame(tick);
  window.onresize = place;
}

const CH_TOK = /^\(?[A-G](?:#|b)?(?:maj|min|dim|aug|sus|add|m|M|°|º|\+)?\d*(?:M|maj)?\d*(?:\([#b+\-]?\d+(?:[\/,][#b+\-]?\d+)*\))?(?:sus\d*|add\d+)?(?:\/[A-G](?:#|b)?)?\)?$/;

    if (inTab){ if (!t || TAB_LINE.test(l) || /^parte \d/i.test(t)) { if (!t) inTab = false; continue; } inTab = false; }

    if (secInline && isChordLine(secInline[2])){ out.push('['+secInline[1].trim()+']'); l = secInline[2]; }

      const chords = []; const re = /\S+/g; let m; while ((m = re.exec(l))){ if (CH_TOK.test(m[0])) chords.push({c:m.index, n:m[0]}); }
      let j = i+1; while (j < lines.length && false) j++;
      const nxt = lines[i+1] !== undefined ? lines[i+1].replace(/\s+$/,'') : '';
      const nxtIsLyric = nxt.trim() && !isChordLine(nxt) && !isSec(nxt) && !TAB_LINE.test(nxt) && !JUNK.test(nxt.trim()) && !/^\[/.test(nxt.trim());
      if (nxtIsLyric){
        const words = []; const wr = /\S+/g; let w; while ((w = wr.exec(nxt))) words.push({s:w.index, e:w.index+w[0].length});
        const li = out.length; let extra = 0; const used = new Set();
        chords.forEach(ch => {
          found.push(ch.n);

          while (wi >= 0 && wi < words.length && used.has(wi)) wi++;

    riffTimers.push(setTimeout(() => layer.querySelectorAll('[data-col].play').forEach(x=>x.classList.remove('play')), (r.notes.length*step+.4)*1000));

}

  if (view.sheet==='song'){ const s = songs.find(x=>x.id===view.song); if (!s){ closeSheet(); return; } layer.innerHTML = songSheet(s); bindSong(s); }
  if (view.sheet==='trocas'){ const s = songs.find(x=>x.id===view.song); if (!s){ closeSheet(); return; } layer.innerHTML = trocasSheet(s);

function fmtDate(d){ try { const [y,m,dd]=d.split('-'); return `${dd}/${m}`; } catch(e){ return d; } }
function toMessage(s){
  const lines = [];
  if (s.title) lines.push(s.title + (s.artist?' · '+s.artist:''));
  if (s.link) lines.push(s.link);
  lines.push(s.capo ? 'Capotraste '+s.capo : 'Sem capotraste');
  if (s.bpm) lines.push(s.bpm+' bpm');
  lines.push('');
  (s.chords||[]).forEach(c => lines.push(codeOf(c) ? codeOf(c)+'  ('+detect(c)+')' : detect(c)));
  const st = fitStrum(s.strum, s.meter||'4/4'); if (st.some(Boolean)) { lines.push(''); lines.push('Batida: '+st.map(x=>GLYPH[x]).join(' ')); }
  return lines.join('\n');
}
function markWord(s, key){
  const s2 = JSON.parse(JSON.stringify(s)); const m = {...(s2.lmarks||{})};
  if (view.paint==='erase' || view.paint==null || m[key]===view.paint) delete m[key]; else m[key] = view.paint;
  s2.lmarks = m; saveSong(s2).then(()=>refreshSheet()); refreshSheet();
}
function bindSong(s){
  layer.querySelectorAll('[data-disp]').forEach(b => b.onclick = () => { setDisplay(b.dataset.disp); refreshSheet(); render(); });
  layer.onclick = e => {
    const lw = e.target.closest('[data-lw]'); if (lw){ markWord(s, lw.dataset.lw); return; }
    const pt = e.target.closest('[data-paint]'); if (pt){ view.paint = pt.dataset.paint==='erase' ? 'erase' : +pt.dataset.paint; refreshSheet(); return; }
    const rb = e.target.closest('[data-riff]'); if (rb){ playRiff(s, +rb.dataset.riff); return; }
    const hb = e.target.closest('[data-hear]'); if (hb){ playArpeggio(s.chords[+hb.dataset.hear], s.capo||0); return; }
    const k = e.target.closest('[data-know]'); if (k){ setMastered(k.dataset.know, !isMastered(k.dataset.know)); refreshSheet(); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act==='close') closeSheet();
    if (act==='edit') openEditor(s);
    if (act==='del') { closeSheet(); uxDeleteSong(s.id); return; }
    if (act==='del-no') { view.confirmDel = false; refreshSheet(); }
    if (act==='del-yes') { closeSheet(); deleteSong(s.id); toast('Música apagada'); }
    if (act==='practice') openPractice(s);
    if (act==='trocas') openTrocas(s);

  };

function showCopy(txt){

function tidyLyrics(why){

  const raw = ed.s.lyrics || ''; if (!raw.trim()) return;
  const r = processLyricsText(raw, ed.s);
  if (!r.changed && !r.hadChords){ if (why==='button'){ ed.lyMsg = 'A letra já está organizada.'; ed.lyUndo = null; rerender(true,false); } return; }
  ed.lyUndo = {lyrics: raw, lmarks: JSON.parse(JSON.stringify(ed.s.lmarks||{})), chords: JSON.parse(JSON.stringify(ed.s.chords||[])), capo: ed.s.capo};
  ed.s.lyrics = r.text;
  if (r.hadChords){ ed.s.lmarks = r.lmarks; ed.s.chords = r.chords; }
  if (r.capo!=null && !ed.s.capo) ed.s.capo = r.capo;
  const parts = [`${r.verses} ${r.verses===1?'linha':'linhas'}`, `${r.stanzas} ${r.stanzas===1?'estrofe':'estrofes'}`];
  if (r.hadChords) parts.push(`${r.placed} ${r.placed===1?'acorde posicionado':'acordes posicionados'}`);
  if (r.capo!=null) parts.push('capo '+r.capo);
  ed.lyMsg = 'Organizei: ' + parts.join(' · ') + '.';
  rerender(true, false);
  const b = document.getElementById('ed-lyrics'); if (b){ try { b.scrollIntoView({block:'center'}); } catch(e){} }
}

function applyParsed(p, source){

  if (p.capo!=null){ ed.s.capo = p.capo; got.push(p.capo ? 'capo '+p.capo : 'sem capo'); }
  if (p.bpm){ ed.s.bpm = p.bpm; got.push(p.bpm+' bpm'); }
  if (p.chords && p.chords.length){ ed.s.chords = p.chords; got.push(p.chords.length+(p.chords.length===1?' acorde: ':' acordes: ')+p.chords.map(detect).join(' ')); }

async function aiPaste(){

Responda SOMENTE com JSON neste formato:
{"link":string|null,"capo":number|null,"bpm":number|null,"title":string|null,"chords":["21-42-32"],"riffs":[{"label":"Intro","notes":["60","45↑"]}],"strum":"D,,D,U,,U,D,U"|null,"notes":string|null}
Regras: chords na ordem da mensagem, cada um só com posições "corda+casa" unidas por hífen. riffs: cada nota como "corda+casa" mais técnica opcional. strum: 8 posições separadas por vírgula (D baixo, U cima, X abafado, vazio pausa) ou null. notes: qualquer instrução que não caiba nos outros campos, em português, curta. Não invente nada que não esteja na mensagem.
Mensagem:
"""${txt}"""`;
  try {
    const r = await sampleFn.json(prompt, {modelTier:'quick'});
    if (!ed) return;
    const p = {link:r.link||null, capo: typeof r.capo==='number' ? r.capo : null, bpm: typeof r.bpm==='number' ? r.bpm : null, title:r.title||null, notes:r.notes||null, chords:[], riffs:[], strum:null};

/* ---------- guitar sound (Karplus-Strong pluck) ---------- */
const audio = {ctx:null, cache:{}};
/* iPhone: com a chave de silencioso ligada o Safari cala o Web Audio. Pedimos sessão de "reprodução"
   (iOS 17+) e, para versões antigas, tocamos um áudio mudo em loop, que faz o sistema tratar o app como player. */
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
function silentWavUrl(){
  const sr = 8000, n = sr/2, b = new ArrayBuffer(44 + n*2), v = new DataView(b);
  const w = (o, t) => { for (let i=0;i<t.length;i++) v.setUint8(o+i, t.charCodeAt(i)); };

}
function unlockAudio(){
  try {

    if (audio.tag.paused){ const pr = audio.tag.play(); if (pr && pr.catch) pr.catch(()=>{}); }

}

function actx(){
  if (!audio.ctx){ audio.ctx = new (window.AudioContext||window.webkitAudioContext)(); }
  if (audio.ctx.state !== 'running' && audio.ctx.resume) audio.ctx.resume();

function ksBuffer(ctx, midi, dur){
  const key = midi+':'+dur; if (audio.cache[key]) return audio.cache[key];

function mutedSet(ch){
  const pos = ch.pos||[]; const bass = pos.length ? Math.max(...pos.map(p=>p[0])) : 6;

    const m = explicit || !libN ? ((ch.mute||[]).includes(s) || (!(ch.open||[]).includes(s) && s>bass)) : (LIB_MUTE[libN]||[]).includes(s);

    g += `<text x="${X(s)}" y="${H-6}" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".5" font-family="JetBrains Mono,monospace">${s}</text>`; }
  if (base>1) g += `<text x="${x0-10}" y="${y0+dy*.65}" font-size="11" text-anchor="end" fill="currentColor" fill-opacity=".7">${base}ª</text>`;
  const mb = mutedSet(B);

    if (fret) continue;
    g += mb.has(s) ? `<path d="M${x-5} 14 l10 10 m0 -10 l-10 10" stroke="currentColor" stroke-opacity=".55" stroke-width="1.6" fill="none"/>` : `<circle cx="${x}" cy="19" r="5" fill="none" stroke="currentColor" stroke-opacity=".6" stroke-width="1.5"/>`; }
  const arrow = (x1,y1,x2,y2,i) => { const mx=(x1+x2)/2 + (y1===y2?0:14), my=(y1+y2)/2 + (y1===y2?-16:0);
    return `<path class="mv-path" style="animation-delay:${i*.15}s" d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 5" marker-end="url(#ah)"/>`; };
  let ai=0;
  mv.slide.forEach(m => g += arrow(X(m.s), Y(m.from), X(m.s), Y(m.to)-12*Math.sign(m.to-m.from), ai++));
  mv.jumps.forEach(m => { const x1=X(m.from.s), y1=Y(m.from.f), x2=X(m.to.s), y2=Y(m.to.f); const d=Math.hypot(x2-x1,y2-y1)||1; g += arrow(x1,y1,x2-(x2-x1)/d*13,y2-(y2-y1)/d*13, ai++); });
  const tgt = [...mv.slide.map(m=>({s:m.s,f:m.to})), ...mv.jumps.map(m=>m.to), ...mv.places];
  tgt.forEach(p => g += `<circle class="mv-target" cx="${X(p.s)}" cy="${Y(p.f)}" r="11" fill="var(--glowSoft)" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 3"/><text x="${X(p.s)}" y="${Y(p.f)+3.5}" font-size="9.5" text-anchor="middle" fill="var(--accentInk)" font-weight="700" font-family="JetBrains Mono,monospace">${p.s}${p.f}</text>`);
  mv.keep.forEach(p => g += `<circle class="mv-keep" cx="${X(p.s)}" cy="${Y(p.f)}" r="16" fill="none" stroke="var(--ok)" stroke-width="2"/><circle cx="${X(p.s)}" cy="${Y(p.f)}" r="11" fill="var(--ok)"/><text x="${X(p.s)}" y="${Y(p.f)+3.5}" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="700" font-family="JetBrains Mono,monospace">${p.s}${p.f}</text>`);
  const moving = [...mv.slide.map(m=>({s:m.s,f:m.from})), ...mv.jumps.map(m=>m.from), ...mv.lifts];
  moving.forEach(p => g += `<circle class="mv-cur" cx="${X(p.s)}" cy="${Y(p.f)}" r="11" fill="var(--accent)"/><text x="${X(p.s)}" y="${Y(p.f)+3.5}" font-size="9.5" text-anchor="middle" fill="var(--onAccent)" font-weight="700" font-family="JetBrains Mono,monospace">${p.s}${p.f}</text>`);
  mv.lifts.forEach(p => g += `<path d="M${X(p.s)+8} ${Y(p.f)-14} l8 -8 m0 8 l-8 -8" stroke="var(--bad)" stroke-width="2" fill="none"/>`);
  return `<svg class="mvdia" viewBox="0 0 ${W} ${H}" role="img" aria-label="Movimento dos dedos"><defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>${g}</svg>`;
}
function moveSteps(mv){
  const c = (s,f) => `<span class="mono cpos">${s}${f}</span>`;
  const out = [];
  mv.keep.forEach(p => out.push(['keep', `${c(p.s,p.f)} fica parado. Use esse dedo como âncora.`]));
  mv.slide.forEach(m => out.push(['move', `Na corda ${m.s}, deslize ${c(m.s,m.from)} → ${c(m.s,m.to)} ${m.to>m.from?'(uma casa para o corpo do violão)':'(uma casa para a cabeça do violão)'}`.replace('uma casa', Math.abs(m.to-m.from)===1?'uma casa':Math.abs(m.to-m.from)+' casas')]));
  mv.jumps.forEach(m => out.push(['move', `${c(m.from.s,m.from.f)} → ${c(m.to.s,m.to.f)}: ${m.from.s===m.to.s?'mesma corda':'mude para a corda '+m.to.s}${m.from.f===m.to.f?', mesma casa':', casa '+m.to.f}`]));
  mv.lifts.forEach(p => out.push(['lift', `Tire o dedo de ${c(p.s,p.f)}`]));
  mv.places.forEach(p => out.push(['move', `Coloque um dedo em ${c(p.s,p.f)}`]));
  mv.muteOn.forEach(s => out.push(['mute', `Não toque a corda ${s} neste acorde`]));
  mv.muteOff.forEach(s => out.push(['open', `A corda ${s} volta a soar solta`]));
  return out;
}

function tickTrainer(){
  const t = trainer; const el = document.getElementById('trainer'); if (!t || !el) return;
  const R = 86, C = 2*Math.PI*R; const pr = el.querySelector('.tr-prog'); if (pr) pr.style.strokeDashoffset = (C*(1-t.left/60)).toFixed(1);

function startDemo(){
  const t = trainer; t.state='demo'; t.demoFlip=false; let n=0;
  const step = () => { if (!trainer || trainer.state!=='demo') return; playChord(shapeOf(t.demoFlip ? t.b : t.a), 0, undefined, {gain:.18, dur:1.6}); renderTrainer(); n++;
    if (n>=6){ stopDemo(); t.state='ready'; t.demoFlip=false; renderTrainer(); return; }
    t.demoTimer = setTimeout(() => { t.demoFlip = !t.demoFlip; step(); }, 1900); };

}
function stopDemo(){ if (trainer){ clearTimeout(trainer.demoTimer); } }
function startTrainer(){
  const t = trainer; t.state='run'; t.count=0; t.left=60; t.prevBest = bestOf(t.k); t.end = performance.now()+60000;
  try { const ctx = actx(); pluck(76, ctx.currentTime+.02, .25, .6); } catch(e){}
  clearInterval(t.t);
  t.t = setInterval(() => { t.left = Math.max(0, (t.end - performance.now())/1000);
    if (t.left <= 0){ clearInterval(t.t); finishTrainer(); } else tickTrainer(); }, 200);

}
function trTap(){ const t = trainer; if (!t || t.state!=='run') return; t.count++; renderTrainer(); }
function finishTrainer(){
  const t = trainer; t.state='done';
  try { const ctx = actx(); pluck(76, ctx.currentTime+.02, .25, .8); pluck(83, ctx.currentTime+.18, .25, 1.2); } catch(e){}
  const rec = changes.pairs[t.k] || {best:0, runs:[]};
  rec.runs = [...(rec.runs||[]), {at:new Date().toISOString(), n:t.count}].slice(-30);
  rec.best = Math.max(rec.best||0, t.count);
  changes = {...changes, pairs:{...changes.pairs, [t.k]:rec}}; saveChanges();
  renderTrainer(); if (view.tab==='treino') render(); if (view.sheet==='trocas') refreshSheet();
  if (t.count > (t.prevBest||0) && t.count > 0) confetti(90); checkAch();
}

let lessons = [];
const LSL = 'fluid.lessons.v1';
const todayLocal = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const MONTHS = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const WEEK = ['dom','seg','ter','qua','qui','sex','sáb'];
function dateParts(iso){ const [y,m,d] = (iso||todayLocal()).split('-').map(Number); const dt = new Date(y,m-1,d); return {d, mon:MONTHS[m-1], wk:WEEK[dt.getDay()], y}; }
async function saveLesson(l){
  l.updatedAt = new Date().toISOString();
  const i = lessons.findIndex(x=>x.id===l.id); if (i>=0) lessons[i]=l; else lessons.unshift(l);
  lessons.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if (db){ const {id, ...body} = l; try { await db.collection('lessons').doc(id).set(JSON.parse(JSON.stringify(body))); } catch(e){ toast('Não consegui salvar a aula agora.'); } }
  else lsSet(LSL, lessons);
}
async function deleteLesson(id){
  lessons = lessons.filter(l=>l.id!==id);
  if (db){ try { await db.collection('lessons').doc(id).delete(); } catch(e){ toast('Não consegui apagar agora.'); } } else lsSet(LSL, lessons);
}

function trocasHTML(song){
  const num = view.display==='num';
  const lab = n => { const c = codeOf(shapeOf(n)); return num && c ? c : n; };
  const alt = n => { const c = codeOf(shapeOf(n)); return num ? n : (c || ''); };
  const steps = [];
  if (song){ const ns = songNames(song); for (let i=0;i<ns.length;i++){ const a = ns[i], b = ns[(i+1)%ns.length]; if (a===b) continue; if (i===ns.length-1 && ns.length===2) break; steps.push({a, b, k:pairKey(a,b), last:i===ns.length-1}); } }
  if (!steps.length) return `<p class="hint">Esta música precisa de pelo menos dois acordes diferentes para treinar as trocas.</p>`;
  let focus = -1, low = Infinity; steps.forEach((st,i) => { const b = bestOf(st.k); if (b < low){ low = b; focus = i; } });
  return `<div class="path" aria-label="Sequência de ${esc(song.title||'')}">${songNames(song).map((n,i,arr)=>`<span class="path-c${num?' mono':''}">${esc(lab(n))}</span>${i<arr.length-1?'<i aria-hidden="true">→</i>':'<i aria-hidden="true">↺</i>'}`).join('')}</div>

      return `<button class="step${i===focus?' focus':''}" data-pair="${esc(st.a)}|${esc(st.b)}">
        <span class="step-i">${st.last?'volta':(i+1)+'ª'}</span>
        <span class="step-m"><span class="step-n${num?' mono':''}"><b>${esc(lab(st.a))}</b><i aria-hidden="true">→</i><b>${esc(lab(st.b))}</b></span>
          ${alt(st.a)&&alt(st.b)?`<small>${esc(alt(st.a))} → ${esc(alt(st.b))}</small>`:''}</span>
        <span class="step-r">${r ? `<b class="mono">${r.best}</b><small>recorde</small>` : (i===focus ? `<small class="go">comece aqui</small>` : `<small>sem marca</small>`)}</span>

/* ---------- microfone compartilhado ---------- */
const mic = { stream:null, src:null, an:null, users:0 };
async function micOpen(){
  if (mic.an) { mic.users++; return mic; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nomic');
  const ctx = actx();
  mic.stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
  mic.src = ctx.createMediaStreamSource(mic.stream);
  mic.an = ctx.createAnalyser(); mic.an.fftSize = 8192; mic.an.smoothingTimeConstant = 0;
  mic.src.connect(mic.an); mic.users = 1;
  return mic;
}
function micClose(force){
  mic.users = Math.max(0, mic.users - 1);
  if (mic.users && !force) return;
  try { mic.src && mic.src.disconnect(); } catch(e){}
  try { mic.stream && mic.stream.getTracks().forEach(t => t.stop()); } catch(e){}
  mic.stream = mic.src = mic.an = null; mic.users = 0;
}
const micErr = e => toast(e && e.name==='NotAllowedError' ? 'Libere o microfone para o Fluid nas permissões do navegador.' : 'Não consegui usar o microfone neste aparelho.');

/* detecção de altura (autocorrelação com refinamento parabólico) */
const pitchBuf = new Float32Array(4096);
function detectPitch(an, sr){
  const buf = pitchBuf.subarray(0, Math.min(4096, an.fftSize)); an.getFloatTimeDomainData(buf);
  let rms = 0; for (let i=0;i<buf.length;i++) rms += buf[i]*buf[i]; rms = Math.sqrt(rms/buf.length);
  if (rms < 0.012) return { f:0, rms };
  const minLag = Math.floor(sr/1000), maxLag = Math.floor(sr/65), n = buf.length - maxLag;
  let best = -1, bestLag = -1; const corr = new Float32Array(maxLag+2);
  for (let lag=minLag; lag<=maxLag; lag++){
    let c = 0, e1 = 0, e2 = 0;
    for (let i=0;i<n;i++){ const a = buf[i], b = buf[i+lag]; c += a*b; e1 += a*a; e2 += b*b; }
    const v = c / Math.sqrt(e1*e2 + 1e-12); corr[lag] = v;
    if (v > best){ best = v; bestLag = lag; }
  }
  if (best < 0.82 || bestLag < 0) return { f:0, rms };
  // prefere a primeira oitava com correlação quase máxima (evita erro de oitava abaixo)
  for (let lag=minLag; lag<bestLag; lag++){ if (corr[lag] > best*0.94 && corr[lag] >= corr[lag-1] && corr[lag] >= corr[lag+1]){ bestLag = lag; break; } }
  const y0 = corr[bestLag-1]||0, y1 = corr[bestLag], y2 = corr[bestLag+1]||0, d = (y2 - y0) / (2*(2*y1 - y0 - y2) || 1);
  return { f: sr / (bestLag + (isFinite(d) ? d : 0)), rms, clarity: best };
}

const ytIdOf = u => { if (!u) return ''; const m = String(u).match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : ''; };
let ytApi = null;
function ytLoad(){
  if (ytApi) return ytApi;
  ytApi = new Promise(res => {
    if (window.YT && window.YT.Player) return res(window.YT);
    const prev = window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady = () => { prev && prev(); res(window.YT); };
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => res(null); document.head.appendChild(s);
    setTimeout(() => res(window.YT && window.YT.Player ? window.YT : null), 9000);
  });
  return ytApi;
}
along = { show:false, rate:1, player:null, ready:false, vid:'', playing:false };
function alongVid(s){ return ytIdOf(s.yt) || ytIdOf(s.link); }
function alongCard(){
  const p = practice; if (!p) return;

  if (!along.show){ el && el.remove(); return; }
  const vid = alongVid(p.s);
  if (!el){ el = document.createElement('div'); el.id = 'along'; el.className = 'along'; document.body.appendChild(el); }
  if (!vid){
    const q = encodeURIComponent([p.s.title, p.s.artist].filter(Boolean).join(' '));
    el.innerHTML = `<div class="al-head"><b>Tocar junto com a música</b><button class="al-x" data-al="close" aria-label="Fechar">${I.close}</button></div>
      <p>Cole o link do vídeo no YouTube para tocar junto, com a velocidade que quiser.</p>
      <div class="al-row"><input class="inp" id="al-url" placeholder="https://youtube.com/watch?v=..." inputmode="url"><button class="btn primary" data-al="save">Usar</button></div>
      <a class="al-find" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Procurar "${esc(p.s.title||'a música')}" no YouTube</a>`;
    return;
  }
  if (along.vid !== vid || !el.querySelector('#al-frame')){
    along.vid = vid; along.ready = false; along.player = null;
    el.innerHTML = `<div class="al-video"><div id="al-frame"></div></div>
      <div class="al-bar"><div class="seg" role="group" aria-label="Velocidade">${[.5,.75,1].map(r => `<button data-al-rate="${r}" aria-pressed="${along.rate===r}">${r===1?'Normal':Math.round(r*100)+'%'}</button>`).join('')}</div>
        <button class="al-x" data-al="close" aria-label="Fechar vídeo">${I.close}</button></div>`;
    ytLoad().then(YT => {
      if (!YT){ const f = el.querySelector('.al-video'); if (f) f.innerHTML = `<p class="al-err">O vídeo não carregou aqui. <a href="https://youtu.be/${vid}" target="_blank" rel="noopener">Abrir no YouTube</a></p>`; return; }
      along.player = new YT.Player('al-frame', { videoId: vid, playerVars:{ playsinline:1, rel:0, modestbranding:1 },
        events:{ onReady: () => { along.ready = true; try { along.player.setPlaybackRate(along.rate); } catch(e){} if (practice && practice.playing) alongPlay(); },
                 onStateChange: e => { along.playing = e.data === 1; } } });
    });
  } else {
    el.querySelectorAll('[data-al-rate]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.alRate === along.rate)));
  }
}
function alongPlay(){ if (along.player && along.ready){ try { along.player.setPlaybackRate(along.rate); along.player.playVideo(); } catch(e){} } }
function alongPause(){ if (along.player && along.ready){ try { along.player.pauseVideo(); } catch(e){} } }
function alongClose(){ alongPause(); along.show = false; try { along.player && along.player.destroy(); } catch(e){} along.player = null; along.vid = ''; along.ready = false; const el = document.getElementById('along'); el && el.remove(); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-al],[data-al-rate]'); if (!b) return;
  const p = practice; if (!p) return;
  if (b.dataset.alRate){ along.rate = +b.dataset.alRate; const base = p.baseBpm || p.bpm; p.baseBpm = base; p.bpm = Math.round(base * along.rate); try { along.player && along.player.setPlaybackRate(along.rate); } catch(err){} renderPractice(); alongCard(); return; }

let rbCaret = null;
const RB_LABEL = /^\s*[^:\n]*[A-Za-zÀ-ÿ][^:\n]{0,23}:\s*/;
function rbLineRange(ta){
  const v = ta.value; const at = rbCaret == null ? v.length : Math.min(rbCaret, v.length);
  const st = v.lastIndexOf('\n', at - 1) + 1; let en = v.indexOf('\n', at); if (en < 0) en = v.length;
  return { st, en, line: v.slice(st, en) };
}
function rbSet(ta, st, en, line){
  ta.value = ta.value.slice(0, st) + line + ta.value.slice(en); const caret = st + line.length; rbCaret = caret;
  ta.dispatchEvent(new Event('input', { bubbles:true }));
  const t2 = document.getElementById('ed-riffs'); if (t2 && t2 !== ta) t2.value = ta.value; try { (t2||ta).setSelectionRange(caret, caret); } catch(e){}
  rbMarks();
}
let rbTimers = [];
function rbMarks(){ const ta = document.getElementById('ed-riffs'); if (!ta) return; const { line } = rbLineRange(ta);
  const used = new Set((line.replace(RB_LABEL, '').match(/\b[1-6]\d{1,2}/g) || []));
  document.querySelectorAll('.rb-c').forEach(c => c.classList.toggle('used', used.has(c.dataset.rbn))); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-rbn],[data-rb]'); if (!b) return; const ta = document.getElementById('ed-riffs'); if (!ta) return;
  e.preventDefault();
  const capo = (typeof ed !== 'undefined' && ed && ed.s && ed.s.capo) || 0;
  if (b.dataset.rbn){
    const s = +b.dataset.rbn[0], f = +b.dataset.rbn.slice(1); const { st, en, line } = rbLineRange(ta);
    const sep = !line.trim() ? '' : /\s$/.test(line) ? '' : ' ';
    rbSet(ta, st, en, line + sep + s + f);
    try { pluck(OPEN[s] + f + capo, actx().currentTime + .01, .26, 1.4); } catch(err){}
    b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 450); buzz(6); return;
  }
  const a = b.dataset.rb, { st, en, line } = rbLineRange(ta);
  if (a === 'pull'){ if (/\d$/.test(line)) rbSet(ta, st, en, line + '↑'); else toast('Toque uma nota antes de marcar a puxada'); }
  if (a === 'rest') rbSet(ta, st, en, line + (line.trim() ? ' ' : '') + '--');
  if (a === 'undo'){ const lab = (line.match(RB_LABEL)||[''])[0], rest = line.slice(lab.length).replace(/\s*\S+\s*$/, ''); rbSet(ta, st, en, rest ? lab + rest : (line.slice(lab.length).trim() ? lab : '')); }
  if (a === 'line'){ const v = ta.value.replace(/\s+$/, ''); rbSet(ta, 0, ta.value.length, v + (v ? '\n' : '')); }
  if (a === 'label'){ const n = ta.value.split('\n').filter(l => RB_LABEL.test(l)).length + 1; const name = 'Frase ' + n + ': ';
    if (RB_LABEL.test(line)) toast('Esta linha já tem nome. Toque em Nova linha para começar outra parte.'); else rbSet(ta, st, en, name + line.trim()); }
  if (a === 'play'){
    rbTimers.forEach(clearTimeout); rbTimers = [];
    const body = line.replace(RB_LABEL, ''); const notes = parseRiffText(body);
    if (!notes){ toast('Toque pelo menos duas notas para ouvir'); return; }
    const bpm = (typeof ed !== 'undefined' && ed && ed.s && ed.s.bpm) || 80, step = 60/bpm/2, t0 = actx().currentTime + .05;
    notes.forEach((n, i) => { if (!n.rest) pluck(OPEN[n.s] + n.f + capo, t0 + i*step, .26, 1.6);
      rbTimers.push(setTimeout(() => { document.querySelectorAll('.rb-c.play').forEach(x => x.classList.remove('play')); if (!n.rest){ const c = document.querySelector(`[data-rbn="${n.s}${n.f}"]`); c && c.classList.add('play'); } }, (i*step + .05)*1000)); });
    rbTimers.push(setTimeout(() => document.querySelectorAll('.rb-c.play').forEach(x => x.classList.remove('play')), (notes.length*step + .4)*1000));
  }
});

/* ---------- números que sobem contando ---------- */
const countMemo = {};
function countFmt(v, f){ if (f==='brl') return (Number(v)||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); if (f==='pct') return Math.round(v) + '%'; return String(Math.round(v)); }
function countUp(el){
  const to = Number(el.dataset.count), f = el.dataset.fmt || '', key = el.dataset.ck || '';
  if (!isFinite(to)) return; el.dataset.counted = '1';
  const from = key && countMemo[key] != null ? countMemo[key] : 0; if (key) countMemo[key] = to;
  if (from === to || reduceMotion()) { el.textContent = countFmt(to, f); return; }
  const t0 = performance.now(), dur = Math.min(1100, 500 + Math.abs(to - from) * 2);
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = countFmt(from + (to - from) * e, f); if (k < 1 && el.isConnected) requestAnimationFrame(step); };
  el.textContent = countFmt(from, f); requestAnimationFrame(step);
}
new MutationObserver(list => { for (const m of list) for (const n of m.addedNodes){ if (n.nodeType !== 1) continue; if (n.dataset && n.dataset.count != null && !n.dataset.counted) countUp(n); n.querySelectorAll && n.querySelectorAll('[data-count]:not([data-counted])').forEach(countUp); } })
  .observe(document.body, { childList:true, subtree:true });

/* ---------- deslizar (lição feita, pagamento recebido, cobrar) ---------- */
let sw = null, swSuppress = 0;
document.addEventListener('pointerdown', e => {
  if (e.button > 0) return; const el = e.target.closest('[data-swipe]'); if (!el) return;
  if (e.target.closest('input,textarea,select')) return;
  const fg = el.querySelector(':scope > .sw-fg'); if (!fg) return;
  sw = { el, fg, x0: e.clientX, y0: e.clientY, dx: 0, state: 'pending', id: e.pointerId, w: el.offsetWidth };
});
document.addEventListener('pointermove', e => {
  if (!sw || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
  if (sw.state === 'pending'){
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ sw = null; return; }
    if (Math.abs(dx) < 10) return;
    sw.state = 'drag'; sw.el.classList.add('swiping'); try { sw.el.setPointerCapture(e.pointerId); } catch(err){}
  }
  const canR = !!sw.el.dataset.swipeR, canL = !!sw.el.dataset.swipeL;
  let x = dx; if ((x > 0 && !canR) || (x < 0 && !canL)) x = x / 6;
  const lim = sw.w * .42; if (Math.abs(x) > lim) x = Math.sign(x) * (lim + (Math.abs(x) - lim) / 3);
  sw.dx = x; sw.fg.style.transform = `translateX(${x}px)`;
  const p = Math.min(1, Math.abs(x) / Math.min(120, sw.w * .3));
  sw.el.style.setProperty('--swp', p.toFixed(2)); sw.el.dataset.dir = x > 0 ? 'r' : 'l';
  if (p >= 1 && !sw.armed){ sw.armed = true; hap('tick'); sw.el.classList.add('armed'); } else if (p < 1 && sw.armed){ sw.armed = false; sw.el.classList.remove('armed'); }
}, { passive: true });
function swEnd(e){
  if (!sw || (e && e.pointerId !== sw.id)) return; const s = sw; sw = null; if (s.state !== 'drag') return;
  swSuppress = Date.now();
  const dir = s.dx > 0 ? 'r' : 'l', ok = s.armed && (dir === 'r' ? s.el.dataset.swipeR : s.el.dataset.swipeL);
  s.fg.style.transition = 'transform .32s cubic-bezier(.2,.8,.2,1)';
  if (ok){
    s.fg.style.transform = `translateX(${dir === 'r' ? s.w : -s.w}px)`;
    setTimeout(() => { s.el.dispatchEvent(new CustomEvent('fluid-swipe', { bubbles: true, detail: { dir } })); lsSet('fluid.swiped', 1); }, 230);
  } else { s.fg.style.transform = ''; setTimeout(() => { s.el.classList.remove('swiping','armed'); s.fg.style.transition = ''; }, 330); }
}
document.addEventListener('pointerup', swEnd); document.addEventListener('pointercancel', swEnd);
document.addEventListener('click', e => { if (Date.now() - swSuppress < 350){ e.stopPropagation(); e.preventDefault(); swSuppress = 0; } }, true);
