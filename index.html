      const nb = layer.querySelector('.sheet-body'); if (nb && nb.animate && !reduceMotion()) nb.animate([{ transform:`translateX(${dir * 40}%)`, opacity:0 }, { transform:'none', opacity:1 }], { duration:340, easing:'cubic-bezier(.2,.85,.2,1)' });
      const h = layer.querySelector('.sheet-head h2'); if (h && h.animate && !reduceMotion()) h.animate([{ opacity:0, transform:`translateX(${dir*16}px)` }, { opacity:1, transform:'none' }], { duration:300 }); }, 150);
  } else { b.style.transition = 'transform .35s cubic-bezier(.2,.9,.3,1.2), opacity .3s'; b.style.transform = ''; b.style.opacity = ''; setTimeout(() => { b.style.transition = ''; }, 360); }
}
layer.addEventListener('touchend', sswEnd); layer.addEventListener('touchcancel', sswEnd);
let peekEl = null;
function peek(s, side, p){
  if (!s){ if (peekEl){ peekEl.remove(); peekEl = null; } return; }
  if (!peekEl){ peekEl = document.createElement('div'); document.body.appendChild(peekEl); }
  peekEl.className = 'song-peek ' + side + (p >= 1 ? ' ready' : ''); peekEl.style.setProperty('--p', p.toFixed(2));
  if (peekEl.dataset.id !== s.id){ peekEl.dataset.id = s.id; peekEl.innerHTML = `<span class="dotc" style="background:${hueOf(s)}">${esc(initials(s.title))}</span><span><small>${side === 'r' ? 'Próxima' : 'Anterior'}</small><b>${esc(s.title || 'Sem título')}</b></span>`; }
  if (p >= 1 && !peekEl.dataset.r){ peekEl.dataset.r = '1'; hap('tick'); } if (p < 1) delete peekEl.dataset.r;
}

/* ---------- puxar para atualizar (tela Hoje) ---------- */
let ptr = null, ptrEl = null, refreshing = false;
document.addEventListener('touchstart', e => {
  if (refreshing || view.tab !== 'hoje' || window.scrollY > 2 || e.touches.length !== 1 || layerOpen()) return;
  if (!e.target.closest('#app')) return;
  ptr = { y0: e.touches[0].clientY, x0: e.touches[0].clientX, dy: 0 };
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!ptr) return; const dy = e.touches[0].clientY - ptr.y0, dx = e.touches[0].clientX - ptr.x0;
  if (dy < 0 || (Math.abs(dx) > Math.abs(dy) && !ptr.on)){ ptrReset(); return; }
  if (!ptr.on && dy < 10) return; ptr.on = true;
  const pull = Math.min(110, dy * .5); ptr.dy = pull;
  if (!ptrEl){ ptrEl = document.createElement('div'); ptrEl.className = 'ptr'; ptrEl.innerHTML = `<span class="ptr-ic"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="ptrG" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1FC8A8"/><stop offset=".5" stop-color="#9A5BE6"/><stop offset="1" stop-color="#E5245E"/></linearGradient></defs><path d="M40.6 27H67.2Q70.6 27 70.6 30.4V34.4Q70.6 39.6 65.4 39.6H33.2Q30.6 39.6 32.2 37.6L38.4 28.6Q39.3 27 40.6 27Z" fill="url(#ptrG)"/><path d="M50.2 45.6H61.2Q64.6 45.6 64.6 49V53.6Q64.6 57.2 61 57.2H50.6Q48.4 57.2 47 59L40.6 67Q38.8 69.2 36 69.2H34Q31 69.2 31 66.4V61Q31 58.2 34 58.2H36.4Q38.6 58.2 39.8 56.7L46.8 47.4Q48.1 45.6 50.2 45.6Z" fill="url(#ptrG)"/></svg></span><small>Puxe para atualizar</small>`; document.body.appendChild(ptrEl); }
  const ready = pull >= 70; ptrEl.classList.toggle('ready', ready); ptrEl.querySelector('small').textContent = ready ? 'Solte para atualizar' : 'Puxe para atualizar';
  if (ready && !ptr.r){ ptr.r = true; hap('tick'); } if (!ready) ptr.r = false;
  ptrEl.style.setProperty('--y', pull + 'px'); ptrEl.style.setProperty('--r', (pull * 3.2) + 'deg'); ptrEl.style.opacity = String(Math.min(1, pull / 40));
  app.style.transition = 'none'; app.style.transform = `translateY(${pull * .6}px)`;
}, { passive: true });
function ptrReset(){ ptr = null; app.style.transition = 'transform .35s cubic-bezier(.2,.9,.3,1.2)'; app.style.transform = ''; setTimeout(() => { app.style.transition = ''; }, 360);
  if (ptrEl && !refreshing){ const e = ptrEl; ptrEl = null; e.classList.add('out'); setTimeout(() => e.remove(), 250); } }
document.addEventListener('touchend', async () => {
  if (!ptr) return; const go = ptr.on && ptr.dy >= 70; if (ptr.on) swSuppress = Date.now();
  if (!go) return ptrReset();
  refreshing = true; ptr = null; ptrEl.classList.add('spin'); ptrEl.querySelector('small').textContent = 'Atualizando…'; ptrEl.style.setProperty('--y', '60px');
  app.style.transition = 'transform .3s'; app.style.transform = 'translateY(40px)'; hap('refresh');
  const t0 = Date.now();
  try { await Promise.all([db && db.refresh ? db.refresh() : null, window.FluidHub && window.FluidHub.refresh ? window.FluidHub.refresh() : null]); } catch(e){}
  await new Promise(r => setTimeout(r, Math.max(0, 900 - (Date.now() - t0))));
  refreshing = false; render(); ptrReset(); uiSound('done'); toast('Tudo atualizado');
});

/* ---------- botão voltar do celular fecha a camada aberta ---------- */
let histOn = false, ignorePop = 0;
function closeTop(){
  if (document.getElementById('ux-search')) return closeSearch();
  if (document.getElementById('ux-fab')) return fabClose();
  if (document.getElementById('ux-sheet')) return uxSheetClose();
  if (document.querySelector('.cele')) return document.querySelectorAll('.cele').forEach(x => x.remove());
  if (document.getElementById('tuner')) return closeTuner();
  if (trainer) return closeTrainer();
  if (pop.chord) return closePop();
  if (practice && !practice.mini) return practice.playing ? practMini(true) : closePractice();
  if (window.FluidHub && window.FluidHub.isOpen && window.FluidHub.isOpen()) return window.FluidHub.back();
  if (view.sheet === 'editor'){ toast('Toque em Salvar ou em Cancelar'); return; }
  if (view.sheet === 'trocas'){ view.sheet = 'song'; return refreshSheet(); }
  if (view.sheet === 'lesson'){ led = null; return closeSheet(); }
  if (view.sheet) return closeSheet();
}
setInterval(() => {
  const o = layerOpen();
  try { if (o && !histOn){ history.pushState({ fluidLayer: 1 }, ''); histOn = true; }
    else if (!o && histOn){ histOn = false; ignorePop++; history.back(); } } catch(e){}
}, 250);
addEventListener('popstate', () => {
  if (ignorePop){ ignorePop--; return; } if (!histOn) return; histOn = false;
  closeTop();
});

/* ---------- atalhos do ícone do app (segurar o ícone na tela inicial) ---------- */
(function(){
  let a = ''; try { a = new URLSearchParams(location.search).get('a') || ''; } catch(e){} if (!a) return;
  try { const u = new URL(location.href); u.searchParams.delete('a'); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch(e){}
  const run = () => { if (mode === 'loading') return setTimeout(run, 300);
    if (a === 'afinar') openTuner();
    if (a === 'metronomo'){ metro.open = true; try { localStorage.setItem('fluid.metro.open','1'); } catch(e){} goTab('treino'); setTimeout(() => document.getElementById('metro')?.scrollIntoView({ behavior:'smooth', block:'center' }), 200); }
    if (a === 'duvida') quickQuestion();
    if (a === 'buscar') openSearch(); };
  setTimeout(run, 600);
})();
/* ================= FIM UX ================= */

/* @@END-EXTRAS@@ */

/* ---------- global wiring ---------- */
app.addEventListener('input', e => { if (e.target.id==='metro-bpm') metroSet(+e.target.value); });
app.addEventListener('keydown', e => { if (e.target.id==='q-new' && e.key==='Enter'){ e.preventDefault(); addQuestion(); } });
app.addEventListener('click', e => {
  const t = e.target.closest('[data-mbeats],[data-act],[data-open],[data-pop],[data-disp],[data-tag],[data-tagdel],[data-tab],[data-lesson],[data-tcheck],[data-pair],[data-tune],[data-trsong],[data-imp]'); if (!t) return;
  if (t.dataset.imp!=null){ importTrack(+t.dataset.imp); return; }
  if (t.dataset.tab){ setTab(t.dataset.tab); render(); return; }
  if (t.dataset.lesson){ openLesson(lessons.find(l=>l.id===t.dataset.lesson)); return; }
  if (t.dataset.mbeats){ metro.beats = +t.dataset.mbeats; metro.n = 0; metroSave(); metroUI(); return; }
  if (t.dataset.tcheck){ const [id,list,i] = t.dataset.tcheck.split(':'); toggleItem(id, list, +i); toast(list==='homework'?'Lição marcada como feita':'Dúvida marcada como respondida'); return; }
  if (t.dataset.pair){ const [a,b] = t.dataset.pair.split('|'); openTrainer(a,b); return; }
  if (t.dataset.trsong){ view.trSong = t.dataset.trsong; render(); return; }
  if (t.dataset.tune){ tunePlay(+t.dataset.tune, t); return; }
  if (t.dataset.disp){ setDisplay(t.dataset.disp); render(); return; }
  if (t.dataset.open){ openSong(t.dataset.open); return; }
  if (t.dataset.pop){ showPop(t.dataset.pop); return; }
  if (t.dataset.tag){ view.tagFilter = view.tagFilter===t.dataset.tag ? null : t.dataset.tag; render(); return; }
  if (t.dataset.tagdel){ const n = t.dataset.tagdel; const c = songs.filter(s=>(s.tags||[]).includes(n)).length;
    if (t.dataset.armed){ removeTag(n); } else { t.dataset.armed='1'; t.classList.add('armed'); t.setAttribute('aria-label','Confirmar: apagar '+n); toast(c ? `Toque de novo para apagar "${n}" de ${c} ${c===1?'música':'músicas'}` : `Toque de novo para apagar "${n}"`); setTimeout(()=>{ delete t.dataset.armed; t.classList.remove('armed'); }, 3000); }
    return; }
  const a = t.dataset.act;
  if (a==='new-lesson'){ openLesson(null); return; }
  if (a==='pair-custom'){ const x = document.getElementById('pa').value, y = document.getElementById('pb').value; if (x===y){ toast('Escolha dois acordes diferentes'); return; } openTrainer(x,y); return; }
  if (a==='imp-go'){ const iq = document.getElementById('imp-q'); findMusic(iq && iq.value); return; }
  if (a==='imp-close'){ view.imp = null; view.impQ = ''; render(); return; }
  if (a==='tag-all'){ view.tagFilter=null; render(); return; }
  if (a==='clear-all'){ view.tagFilter=null; view.chordFilter=null; view.readyFilter=false; view.q=''; render(); return; }
  if (a==='ready'){ view.readyFilter = !view.readyFilter; render(); return; }
  if (a==='tags-edit'){ view.editTags = true; render(); const n=document.getElementById('tag-new'); n&&n.focus(); return; }
  if (a==='tags-done'){ const n=document.getElementById('tag-new'); const v = n && n.value; view.editTags = false; if (v) addTag(v).then(render); else render(); return; }
  if (a==='tag-add'){ const n=document.getElementById('tag-new'); addTag(n && n.value).then(tg=>{ render(); const m=document.getElementById('tag-new'); m&&m.focus(); }); return; }
  if (a==='new') openEditor(null);
  if (a==='hub') return window.FluidHub && window.FluidHub.open();
  if (a==='theme') return toggleTheme();
  if (a==='q-add') return addQuestion();
  if (a==='tuner') return openTuner();
  if (a==='hw-reply'){ view.hwReply = view.hwReply===t.dataset.k ? null : t.dataset.k; render(); const i = document.getElementById('hw-rep-in'); i && i.focus(); return; }
  if (a==='hw-reply-save'){ const [lid, idx] = t.dataset.k.split(':'); const l = lessons.find(x=>x.id===lid); const v = (document.getElementById('hw-rep-in')||{}).value||''; if (!l) return;
    const me = window.FluidWeb ? window.FluidWeb.me().name.split(' ')[0] : 'Comentário';
    const hw = (l.homework||[]).map((x,j) => j===+idx ? {...x, reply: v.trim(), replyBy: me, replyAt: new Date().toISOString()} : {...x});
    saveLesson({...l, homework: hw}); view.hwReply = null; render(); toast('Comentário salvo na lição'); return; }
  if (a==='metro-toggle'){ metro.open = !metro.open; try { localStorage.setItem('fluid.metro.open', metro.open?'1':'0'); } catch(e){} return metroUI(); }
  if (a==='metro-play') return metro.playing ? metroStop() : metroStart();
  if (a==='metro-minus') return metroSet(metro.bpm-1);
  if (a==='metro-plus') return metroSet(metro.bpm+1);
  if (a==='metro-tap') return metroTap();
  if (a==='paste') openEditor(null, {paste:true});
  if (a==='clear-filter'){ view.chordFilter=null; render(); }
  if (a==='focus-list'){ const l=document.getElementById('list'); l && l.scrollIntoView({behavior:'smooth',block:'start'}); }
});
document.addEventListener('keydown', e => {
  if (e.key===' ' && trainer && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){ e.preventDefault(); if (trainer.state==='run') trTap(); else startTrainer(); return; }
  if (e.key==='Escape' && trainer){ closeTrainer(); return; }
  if (e.key==='Escape' && view.sheet==='trocas'){ view.sheet='song'; refreshSheet(); return; }
  if (e.key==='Escape' && view.sheet==='lesson'){ led=null; closeSheet(); return; }
  if (e.key==='Escape'){ if (pop.chord) closePop(); else if (practice && !practice.mini) closePractice(); else if (view.sheet==='editor'){ clearDraft(); ed=null; view.sheet = view.song?'song':null; view.sheet?refreshSheet():closeSheet(); } else if (view.sheet) closeSheet(); }
  if (e.key===' ' && practice && !practice.mini && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName) && document.activeElement.tagName!=='BUTTON'){ e.preventDefault(); practice.playing?stopMetro():startMetro(); }
});

render();
initStore();
setTimeout(restoreDraft, 0);
})();
</script>
